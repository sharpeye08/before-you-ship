<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="t d">
  <title id="t">Handling the same event only once</title>
  <desc id="d">Two copies of the same event, evt_123, arrive. For copy 1, the server checks if the event ID is already saved. It is not, so the server does the work and saves the ID. For copy 2, the server finds the saved ID and does nothing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="310" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Row 1 -->
    <rect x="30" y="40" width="180" height="80" rx="10" fill="#4f6bd8"/>
    <text x="120" y="76" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Copy 1</text>
    <text x="120" y="98" font-size="12" fill="#e8ecff" text-anchor="middle">event evt_123</text>

    <rect x="270" y="40" width="180" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="86" font-size="15" fill="#f2f2f2" text-anchor="middle">ID already saved?</text>

    <rect x="510" y="40" width="180" height="80" rx="10" fill="#1f9d6b"/>
    <text x="600" y="76" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">No: do the work</text>
    <text x="600" y="98" font-size="12" fill="#e6f6ef" text-anchor="middle">then save the ID</text>

    <line x1="212" y1="80" x2="262" y2="80" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="452" y1="80" x2="502" y2="80" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Saved ID link -->
    <line x1="600" y1="122" x2="372" y2="174" stroke="#a0a0a0" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <rect x="452" y="134" width="96" height="18" rx="9" fill="#141414"/>
    <text x="500" y="147" font-size="12" fill="#a0a0a0" text-anchor="middle">saved ID</text>

    <!-- Row 2 -->
    <rect x="30" y="180" width="180" height="80" rx="10" fill="#4f6bd8"/>
    <text x="120" y="216" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Copy 2</text>
    <text x="120" y="238" font-size="12" fill="#e8ecff" text-anchor="middle">same evt_123</text>

    <rect x="270" y="180" width="180" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="226" font-size="15" fill="#f2f2f2" text-anchor="middle">ID already saved?</text>

    <rect x="510" y="180" width="180" height="80" rx="10" fill="#f2c94c"/>
    <text x="600" y="216" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Yes: do nothing</text>
    <text x="600" y="238" font-size="12" fill="#111111" text-anchor="middle">no second upgrade</text>

    <line x1="212" y1="220" x2="262" y2="220" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="452" y1="220" x2="502" y2="220" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="360" y="290" font-size="12" fill="#a0a0a0" text-anchor="middle">Stripe can send the same event more than once. Your server handles it once.</text>
  </g>
</svg>
