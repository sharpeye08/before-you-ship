<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">Many trips or one trip</title>
  <desc id="d">Top: with a query in a loop, the app makes 401 round trips to the database for a page of 100 recipes. Bottom: with include, the app asks for all the data up front and makes 1 or 2 round trips.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="340" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Row 1: query in a loop -->
    <text x="40" y="36" font-size="12" fill="#a0a0a0">QUERY IN A LOOP (100 RECIPES)</text>
    <rect x="40" y="50" width="160" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="120" y="95" font-size="15" fill="#f2f2f2" text-anchor="middle">Your app</text>
    <rect x="520" y="50" width="160" height="80" rx="10" fill="#4f6bd8"/>
    <text x="600" y="95" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Database</text>

    <line x1="206" y1="58" x2="512" y2="58" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="206" y1="74" x2="512" y2="74" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="206" y1="106" x2="512" y2="106" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="206" y1="122" x2="512" y2="122" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="284" y="78" width="150" height="24" rx="12" fill="#f08a4b"/>
    <text x="359" y="95" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">401 round trips</text>

    <!-- Row 2: include -->
    <text x="40" y="196" font-size="12" fill="#a0a0a0">INCLUDE: ASK FOR ALL OF IT UP FRONT</text>
    <rect x="40" y="210" width="160" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="120" y="255" font-size="15" fill="#f2f2f2" text-anchor="middle">Your app</text>
    <rect x="520" y="210" width="160" height="80" rx="10" fill="#4f6bd8"/>
    <text x="600" y="255" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Database</text>

    <line x1="206" y1="250" x2="512" y2="250" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="276" y="226" width="166" height="24" rx="12" fill="#1f9d6b"/>
    <text x="359" y="243" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">1 or 2 round trips</text>

    <text x="360" y="322" font-size="12" fill="#a0a0a0" text-anchor="middle">Each round trip costs time, even when the query itself is fast.</text>
  </g>
</svg>
