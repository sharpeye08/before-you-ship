<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">Last write wins loses Alice's line</title>
  <desc id="d">Alice and Bob both load the note at 7:00. At 7:02, Alice saves the note with a new Chapter 4 line. At 7:03, Bob saves his whole old copy with one changed word. Bob's save replaces everything, so the server's note has the exam time but no Chapter 4 line.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Alice -->
    <rect x="30" y="50" width="170" height="70" rx="10" fill="#f2c94c"/>
    <text x="115" y="81" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Alice</text>
    <text x="115" y="101" font-size="12" fill="#111111" text-anchor="middle">loaded at 7:00</text>

    <!-- Bob -->
    <rect x="30" y="200" width="170" height="70" rx="10" fill="#e98da4"/>
    <text x="115" y="231" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Bob</text>
    <text x="115" y="251" font-size="12" fill="#111111" text-anchor="middle">loaded at 7:00</text>

    <!-- Server -->
    <rect x="470" y="105" width="220" height="110" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="580" y="135" font-size="15" fill="#f2f2f2" text-anchor="middle">The saved note</text>
    <text x="580" y="162" font-size="12" fill="#a0a0a0" text-anchor="middle">"Exam on Friday at 9:00.</text>
    <text x="580" y="178" font-size="12" fill="#a0a0a0" text-anchor="middle">Bring a calculator."</text>
    <text x="580" y="202" font-size="12" fill="#e5484d" text-anchor="middle">Chapter 4 line: lost</text>

    <!-- Alice saves -->
    <line x1="204" y1="85" x2="464" y2="140" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="334" y="76" font-size="12" fill="#f2c94c" text-anchor="middle">7:02 save: adds the Chapter 4 line</text>

    <!-- Bob saves -->
    <line x1="204" y1="235" x2="464" y2="185" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <text x="334" y="262" font-size="12" fill="#e98da4" text-anchor="middle">7:03 save: his whole old copy + "9:00"</text>

    <text x="690" y="266" font-size="12" fill="#a0a0a0" text-anchor="end">Last write wins:</text>
    <text x="690" y="284" font-size="12" fill="#a0a0a0" text-anchor="end">Bob's save replaced everything.</text>
  </g>
</svg>
