<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Logs, metrics and alerts</title>
  <desc id="d">Your app writes events into logs, which answer what happened. Metrics count events over time and answer how much and how often. An alert answers if a person must act now, and sends a notification to your phone. In the story, only the logs worked, so nobody was told.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="24" y="50" width="130" height="70" rx="10" fill="#f2c94c"/>
    <text x="89" y="81" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Your app</text>
    <text x="89" y="101" font-size="12" fill="#111111" text-anchor="middle">writes events</text>
    <line x1="158" y1="85" x2="184" y2="85" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="190" y="50" width="150" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="265" y="81" font-size="15" fill="#f2f2f2" text-anchor="middle">Logs</text>
    <text x="265" y="101" font-size="12" fill="#a0a0a0" text-anchor="middle">What happened?</text>
    <line x1="344" y1="85" x2="370" y2="85" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="376" y="50" width="150" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="451" y="81" font-size="15" fill="#f2f2f2" text-anchor="middle">Metrics</text>
    <text x="451" y="101" font-size="12" fill="#a0a0a0" text-anchor="middle">How much, how often?</text>
    <line x1="530" y1="85" x2="556" y2="85" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="562" y="50" width="134" height="70" rx="10" fill="#f08a4b"/>
    <text x="629" y="81" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Alert</text>
    <text x="629" y="101" font-size="12" fill="#111111" text-anchor="middle">Act now?</text>
    <line x1="629" y1="124" x2="629" y2="174" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="562" y="180" width="134" height="60" rx="10" fill="#4f6bd8"/>
    <text x="629" y="206" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Your phone</text>
    <text x="629" y="226" font-size="12" fill="#e8ecff" text-anchor="middle">wakes you up</text>

    <!-- Examples -->
    <text x="265" y="150" font-size="12" fill="#a0a0a0" text-anchor="middle">"Payment failed</text>
    <text x="265" y="166" font-size="12" fill="#a0a0a0" text-anchor="middle">for order 1042"</text>
    <text x="451" y="150" font-size="12" fill="#a0a0a0" text-anchor="middle">"3% of requests failed</text>
    <text x="451" y="166" font-size="12" fill="#a0a0a0" text-anchor="middle">in the last 5 minutes"</text>

    <text x="24" y="276" font-size="12" fill="#a0a0a0">In the story, only the logs worked. There was no alert, so nobody was told.</text>
  </g>
</svg>
