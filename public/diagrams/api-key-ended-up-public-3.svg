<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="t d">
  <title id="t">The first hour after a leak</title>
  <desc id="d">Five steps in order. First, rotate the key. Second, store the new key in the right place. Third, check the damage. Fourth, fix the cause. Only then, clean the Git history. A common mistake is to clean the history first while the old key still works.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="250" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="88" y="46" font-size="12" fill="#f08a4b" text-anchor="middle">FIRST</text>
    <text x="632" y="46" font-size="12" fill="#a0a0a0" text-anchor="middle">ONLY THEN</text>

    <rect x="30" y="60" width="116" height="100" rx="10" fill="#f08a4b"/>
    <text x="88" y="86" font-size="12" fill="#111111" text-anchor="middle">1</text>
    <text x="88" y="114" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Rotate</text>
    <text x="88" y="134" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">the key</text>

    <rect x="166" y="60" width="116" height="100" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="224" y="86" font-size="12" fill="#a0a0a0" text-anchor="middle">2</text>
    <text x="224" y="114" font-size="15" fill="#f2f2f2" text-anchor="middle">Store the</text>
    <text x="224" y="134" font-size="15" fill="#f2f2f2" text-anchor="middle">new key</text>

    <rect x="302" y="60" width="116" height="100" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="86" font-size="12" fill="#a0a0a0" text-anchor="middle">3</text>
    <text x="360" y="114" font-size="15" fill="#f2f2f2" text-anchor="middle">Check the</text>
    <text x="360" y="134" font-size="15" fill="#f2f2f2" text-anchor="middle">damage</text>

    <rect x="438" y="60" width="116" height="100" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="496" y="86" font-size="12" fill="#a0a0a0" text-anchor="middle">4</text>
    <text x="496" y="114" font-size="15" fill="#f2f2f2" text-anchor="middle">Fix the</text>
    <text x="496" y="134" font-size="15" fill="#f2f2f2" text-anchor="middle">cause</text>

    <rect x="574" y="60" width="116" height="100" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="632" y="86" font-size="12" fill="#a0a0a0" text-anchor="middle">5</text>
    <text x="632" y="114" font-size="15" fill="#f2f2f2" text-anchor="middle">Clean Git</text>
    <text x="632" y="134" font-size="15" fill="#f2f2f2" text-anchor="middle">history</text>

    <line x1="148" y1="110" x2="160" y2="110" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="284" y1="110" x2="296" y2="110" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="420" y1="110" x2="432" y2="110" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="556" y1="110" x2="568" y2="110" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="30" y="200" font-size="12" fill="#a0a0a0">Until step 1 is done, anyone who copied the key can still use it.</text>
    <text x="30" y="222" font-size="12" fill="#a0a0a0">Common mistake: hours on step 5 while the old key still works.</text>
  </g>
</svg>
