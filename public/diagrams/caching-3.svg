<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">How a shared cache showed Sam's page to everyone</title>
  <desc id="d">Sam loads the home page, and the page says "Hi, Sam". The header says public, so the CDN stores that copy. Later, two other visitors ask for the home page, and the CDN gives each of them Sam's page.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="30" y="110" width="150" height="70" rx="10" fill="#f2c94c"/>
    <text x="105" y="140" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Sam</text>
    <text x="105" y="161" font-size="12" fill="#111111" text-anchor="middle">logged in</text>

    <rect x="270" y="95" width="180" height="100" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="130" font-size="15" fill="#f2f2f2" text-anchor="middle">CDN cache</text>
    <text x="360" y="152" font-size="12" fill="#a0a0a0" text-anchor="middle">stores the page</text>
    <text x="360" y="172" font-size="12" fill="#f2c94c" text-anchor="middle">"Hi, Sam"</text>

    <rect x="540" y="50" width="150" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="615" y="80" font-size="15" fill="#f2f2f2" text-anchor="middle">Visitor B</text>
    <text x="615" y="101" font-size="12" fill="#e5484d" text-anchor="middle">sees "Hi, Sam"</text>

    <rect x="540" y="170" width="150" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="615" y="200" font-size="15" fill="#f2f2f2" text-anchor="middle">Visitor C</text>
    <text x="615" y="221" font-size="12" fill="#e5484d" text-anchor="middle">sees "Hi, Sam"</text>

    <line x1="180" y1="145" x2="266" y2="145" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="223" y="134" font-size="12" fill="#a0a0a0" text-anchor="middle">1. public</text>

    <line x1="450" y1="125" x2="536" y2="90" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <line x1="450" y1="165" x2="536" y2="200" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <text x="495" y="150" font-size="12" fill="#e5484d" text-anchor="middle">2. same copy</text>

    <text x="360" y="275" font-size="12" fill="#a0a0a0" text-anchor="middle">A shared cache gives one stored copy to everyone. Never put one user's data in it.</text>
  </g>
</svg>
