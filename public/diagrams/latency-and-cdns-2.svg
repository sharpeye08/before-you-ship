<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
  <title id="t">Function and database: far apart or together</title>
  <desc id="d">Top: the function runs in Washington, D.C. and the database is in Mumbai. Four queries in a row cost about 200 ms each, so about 800 ms per request. Bottom: the function and the database are both in the Mumbai region. Four queries cost about 1 ms each, so a few milliseconds per request.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="380" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Far apart -->
    <text x="40" y="40" font-size="12" fill="#a0a0a0">FAR APART</text>
    <rect x="40" y="56" width="180" height="76" rx="10" fill="#4f6bd8"/>
    <text x="130" y="90" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Function</text>
    <text x="130" y="112" font-size="12" fill="#e8ecff" text-anchor="middle">Washington, D.C.</text>
    <rect x="500" y="56" width="180" height="76" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="590" y="90" font-size="15" fill="#f2f2f2" text-anchor="middle">Database</text>
    <text x="590" y="112" font-size="12" fill="#a0a0a0" text-anchor="middle">Mumbai</text>

    <text x="360" y="70" font-size="12" fill="#a0a0a0" text-anchor="middle">4 queries in a row</text>
    <line x1="226" y1="80" x2="492" y2="80" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="99" font-size="12" fill="#a0a0a0" text-anchor="middle">about 200 ms each</text>
    <line x1="494" y1="108" x2="228" y2="108" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="162" font-size="15" fill="#f08a4b" text-anchor="middle">= about 800 ms per request</text>

    <line x1="40" y1="186" x2="680" y2="186" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Same region -->
    <text x="40" y="214" font-size="12" fill="#a0a0a0">SAME REGION</text>
    <rect x="40" y="226" width="420" height="110" rx="12" fill="none" stroke="#1f9d6b" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="56" y="246" font-size="12" fill="#1f9d6b">Mumbai region</text>
    <rect x="60" y="256" width="160" height="66" rx="10" fill="#4f6bd8"/>
    <text x="140" y="286" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Function</text>
    <text x="140" y="306" font-size="12" fill="#e8ecff" text-anchor="middle">Mumbai</text>
    <rect x="280" y="256" width="160" height="66" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="286" font-size="15" fill="#f2f2f2" text-anchor="middle">Database</text>
    <text x="360" y="306" font-size="12" fill="#a0a0a0" text-anchor="middle">Mumbai</text>
    <line x1="224" y1="280" x2="274" y2="280" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="276" y1="298" x2="226" y2="298" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="490" y="276" font-size="12" fill="#a0a0a0">4 queries, about 1 ms each</text>
    <text x="490" y="302" font-size="15" fill="#1f9d6b">= a few ms per request</text>

    <text x="360" y="362" font-size="12" fill="#a0a0a0" text-anchor="middle">Keep the function and the database together. Then choose a region near your users.</text>
  </g>
</svg>
