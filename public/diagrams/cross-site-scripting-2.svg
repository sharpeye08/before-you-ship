<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">The same comment, without and with escaping</title>
  <desc id="d">Without escaping, the browser reads Leo's comment as HTML and the pop-up runs. With escaping, the browser gets codes like &amp;lt; instead of real tags, so it shows the comment as plain text and nothing runs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Row 1: without escaping -->
    <text x="40" y="44" font-size="12" fill="#a0a0a0">WITHOUT ESCAPING</text>
    <rect x="40" y="56" width="170" height="72" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="125" y="88" font-size="15" fill="#f2f2f2" text-anchor="middle">Leo's comment</text>
    <text x="125" y="108" font-size="12" fill="#a0a0a0" text-anchor="middle">&lt;img ... onerror&gt;</text>

    <rect x="275" y="56" width="200" height="72" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="375" y="88" font-size="15" fill="#f2f2f2" text-anchor="middle">Browser reads it</text>
    <text x="375" y="108" font-size="12" fill="#a0a0a0" text-anchor="middle">as real HTML</text>

    <rect x="540" y="56" width="150" height="72" rx="10" fill="#e5484d"/>
    <text x="615" y="98" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Pop-up runs</text>

    <line x1="214" y1="92" x2="267" y2="92" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="479" y1="92" x2="532" y2="92" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>

    <!-- Row 2: with escaping -->
    <text x="40" y="182" font-size="12" fill="#a0a0a0">WITH ESCAPING (React's default)</text>
    <rect x="40" y="194" width="170" height="72" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="125" y="226" font-size="15" fill="#f2f2f2" text-anchor="middle">Leo's comment</text>
    <text x="125" y="246" font-size="12" fill="#a0a0a0" text-anchor="middle">&lt;img ... onerror&gt;</text>

    <rect x="275" y="194" width="200" height="72" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="375" y="226" font-size="15" fill="#f2f2f2" text-anchor="middle">Browser gets codes</text>
    <text x="375" y="246" font-size="12" fill="#a0a0a0" text-anchor="middle">&amp;lt;img ... &amp;gt;</text>

    <rect x="540" y="194" width="150" height="72" rx="10" fill="#1f9d6b"/>
    <text x="615" y="226" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Shown as text</text>
    <text x="615" y="246" font-size="12" fill="#e6f6ef" text-anchor="middle">nothing runs</text>

    <line x1="214" y1="230" x2="267" y2="230" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="479" y1="230" x2="532" y2="230" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
