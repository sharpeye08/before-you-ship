<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
  <title id="t">The TLS handshake</title>
  <desc id="d">Step 1: the browser says hello and asks for a secure connection to example.com. Step 2: the server sends its certificate. Step 3: the browser checks the certificate. Step 4: the browser and the server agree on a fresh secret key for this connection only. Step 5: all HTTP messages now travel encrypted with that key.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1f9d6b"/>
    </marker>
  </defs>
  <rect width="720" height="380" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Browser -->
    <rect x="24" y="24" width="150" height="52" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="99" y="56" font-size="15" fill="#f2f2f2" text-anchor="middle">Browser</text>
    <line x1="99" y1="76" x2="99" y2="350" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="4 6"/>

    <!-- Server -->
    <rect x="546" y="24" width="150" height="52" rx="10" fill="#4f6bd8"/>
    <text x="621" y="56" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Server</text>
    <text x="621" y="94" font-size="12" fill="#a0a0a0" text-anchor="middle">example.com</text>
    <line x1="621" y1="100" x2="621" y2="350" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="4 6"/>

    <!-- 1 Hello -->
    <line x1="103" y1="130" x2="613" y2="130" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="120" font-size="15" fill="#f2f2f2" text-anchor="middle">1. "Hello. Secure connection to example.com?"</text>

    <!-- 2 Certificate -->
    <line x1="617" y1="182" x2="107" y2="182" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="172" font-size="15" fill="#f2f2f2" text-anchor="middle">2. "Here is my certificate"</text>

    <!-- 3 Check -->
    <rect x="40" y="204" width="250" height="40" rx="10" fill="#f2c94c"/>
    <text x="165" y="229" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">3. Checks the certificate</text>

    <!-- 4 Agree on key -->
    <line x1="107" y1="280" x2="613" y2="280" stroke="#cfcfcf" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="360" y="270" font-size="15" fill="#f2f2f2" text-anchor="middle">4. Agree on a fresh secret key</text>

    <!-- 5 Encrypted -->
    <line x1="107" y1="334" x2="613" y2="334" stroke="#1f9d6b" stroke-width="2" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
    <text x="360" y="324" font-size="15" fill="#f2f2f2" text-anchor="middle">5. HTTP messages travel encrypted</text>
  </g>
</svg>
