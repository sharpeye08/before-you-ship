<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">Where each answer comes from</title>
  <desc id="d">A user in Bengaluru makes a short trip to a nearby CDN server. The CDN server answers with the logo, CSS, JavaScript and popular recipes, which are the same for everyone. Only personal data, such as the account page and saved recipes, travels on to the faraway region where the function and the database run.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="340" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="40" y="40" font-size="12" fill="#a0a0a0">WHERE EACH ANSWER COMES FROM</text>

    <!-- User -->
    <rect x="40" y="110" width="150" height="80" rx="10" fill="#f2c94c"/>
    <text x="115" y="146" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">User</text>
    <text x="115" y="168" font-size="12" fill="#111111" text-anchor="middle">Bengaluru</text>

    <!-- CDN -->
    <rect x="280" y="110" width="170" height="80" rx="10" fill="#1f9d6b"/>
    <text x="365" y="146" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">CDN server</text>
    <text x="365" y="168" font-size="12" fill="#e6fff4" text-anchor="middle">near India</text>

    <!-- Region -->
    <rect x="540" y="110" width="150" height="80" rx="10" fill="#4f6bd8"/>
    <text x="615" y="140" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Function</text>
    <text x="615" y="160" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">and database</text>
    <text x="615" y="180" font-size="12" fill="#e8ecff" text-anchor="middle">faraway region</text>

    <!-- Arrows -->
    <text x="235" y="96" font-size="12" fill="#a0a0a0" text-anchor="middle">Short trip</text>
    <line x1="198" y1="150" x2="272" y2="150" stroke="#cfcfcf" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="495" y="96" font-size="12" fill="#a0a0a0" text-anchor="middle">Long trip</text>
    <line x1="458" y1="150" x2="532" y2="150" stroke="#cfcfcf" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- What each place answers -->
    <rect x="250" y="216" width="230" height="86" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="270" y="238" font-size="12" fill="#1f9d6b">Same for everyone:</text>
    <text x="270" y="262" font-size="15" fill="#f2f2f2">Logo, CSS, JavaScript</text>
    <text x="270" y="286" font-size="15" fill="#f2f2f2">Popular recipes</text>

    <rect x="510" y="216" width="180" height="86" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="526" y="238" font-size="12" fill="#f08a4b">Personal. Travels far:</text>
    <text x="526" y="262" font-size="15" fill="#f2f2f2">Account page</text>
    <text x="526" y="286" font-size="15" fill="#f2f2f2">Saved recipes</text>

    <text x="115" y="238" font-size="12" fill="#a0a0a0" text-anchor="middle">Most requests stop</text>
    <text x="115" y="256" font-size="12" fill="#a0a0a0" text-anchor="middle">at the nearby</text>
    <text x="115" y="274" font-size="12" fill="#a0a0a0" text-anchor="middle">CDN server.</text>
  </g>
</svg>
