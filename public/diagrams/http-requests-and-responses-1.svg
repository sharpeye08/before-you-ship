<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">A request and a response have the same shape</title>
  <desc id="d">Two columns. The request has a first line with the method and path, then headers, then an empty line, then a body that is often empty for GET. The response has a first line with the status code, then headers, then an empty line, then a body with the page itself.</desc>
  <rect width="720" height="340" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Column titles -->
    <text x="190" y="42" font-size="12" fill="#a0a0a0" text-anchor="middle">REQUEST (BROWSER TO SERVER)</text>
    <text x="530" y="42" font-size="12" fill="#a0a0a0" text-anchor="middle">RESPONSE (SERVER TO BROWSER)</text>

    <!-- Request column -->
    <rect x="40" y="60" width="300" height="56" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="56" y="82" font-size="12" fill="#a0a0a0">First line: method and path</text>
    <text x="56" y="104" font-size="15" fill="#f2f2f2">GET /games</text>

    <rect x="40" y="124" width="300" height="56" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="56" y="146" font-size="12" fill="#a0a0a0">Headers</text>
    <text x="56" y="168" font-size="15" fill="#f2f2f2">Host: www.example.com</text>

    <rect x="40" y="188" width="300" height="28" rx="10" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="190" y="207" font-size="12" fill="#a0a0a0" text-anchor="middle">empty line</text>

    <rect x="40" y="224" width="300" height="56" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="56" y="246" font-size="12" fill="#a0a0a0">Body</text>
    <text x="56" y="268" font-size="15" fill="#f2f2f2">Often empty for GET</text>

    <!-- Response column -->
    <rect x="380" y="60" width="300" height="56" rx="10" fill="#f2c94c"/>
    <text x="396" y="82" font-size="12" fill="#111111">First line: the status code</text>
    <text x="396" y="104" font-size="15" font-weight="600" fill="#111111">200 OK</text>

    <rect x="380" y="124" width="300" height="56" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="396" y="146" font-size="12" fill="#a0a0a0">Headers</text>
    <text x="396" y="168" font-size="15" fill="#f2f2f2">Content-Type: text/html</text>

    <rect x="380" y="188" width="300" height="28" rx="10" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="530" y="207" font-size="12" fill="#a0a0a0" text-anchor="middle">empty line</text>

    <rect x="380" y="224" width="300" height="56" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="396" y="246" font-size="12" fill="#a0a0a0">Body</text>
    <text x="396" y="268" font-size="15" fill="#f2f2f2">The page itself</text>

    <text x="360" y="314" font-size="12" fill="#a0a0a0" text-anchor="middle">Both messages have the same four parts, in the same order.</text>
  </g>
</svg>
