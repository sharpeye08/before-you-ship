<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">The whole pipeline</title>
  <desc id="d">You push a branch. CI runs the checks, and the hosting platform builds a preview deployment. You open a pull request. If the checks are green, the merge is allowed, and the change goes to production. If the checks are red, the merge is blocked, and you fix the problem first.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="360" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Row 1 -->
    <rect x="24" y="40" width="180" height="56" rx="10" fill="#f2c94c"/>
    <text x="114" y="73" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Push a branch</text>
    <line x1="208" y1="68" x2="244" y2="68" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="250" y="40" width="180" height="56" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="340" y="73" font-size="15" fill="#f2f2f2" text-anchor="middle">CI runs checks</text>
    <line x1="434" y1="68" x2="480" y2="68" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="486" y="40" width="210" height="56" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="591" y="73" font-size="15" fill="#f2f2f2" text-anchor="middle">Preview deployment</text>

    <!-- Row 2 -->
    <line x1="340" y1="100" x2="340" y2="144" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="250" y="150" width="180" height="56" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="340" y="183" font-size="15" fill="#f2f2f2" text-anchor="middle">Open pull request</text>

    <!-- Row 3 -->
    <line x1="340" y1="210" x2="340" y2="264" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="352" y="242" font-size="12" fill="#1f9d6b">green</text>
    <rect x="250" y="270" width="180" height="60" rx="10" fill="#1f9d6b"/>
    <text x="340" y="298" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Merge allowed</text>
    <text x="340" y="317" font-size="12" fill="#e6f6ef" text-anchor="middle">checks passed</text>

    <line x1="246" y1="300" x2="210" y2="300" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="270" width="180" height="60" rx="10" fill="#4f6bd8"/>
    <text x="114" y="298" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Production deploy</text>
    <text x="114" y="317" font-size="12" fill="#e8ecff" text-anchor="middle">users get the change</text>

    <line x1="434" y1="196" x2="560" y2="264" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <text x="508" y="222" font-size="12" fill="#e5484d">red</text>
    <rect x="486" y="270" width="210" height="60" rx="10" fill="#1f1f1f" stroke="#e5484d" stroke-width="1.5"/>
    <text x="591" y="298" font-size="15" fill="#f2f2f2" text-anchor="middle">Merge blocked</text>
    <text x="591" y="317" font-size="12" fill="#a0a0a0" text-anchor="middle">fix the problem first</text>
  </g>
</svg>
