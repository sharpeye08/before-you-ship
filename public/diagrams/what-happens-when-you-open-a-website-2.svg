<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">Two errors, two different places</title>
  <desc id="d">Top: with no internet, the request stops at your device and never reaches the server. Bottom: with 404 Not Found, the request reaches the server, and the server answers that it does not have that page.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Row 1: No internet -->
    <text x="40" y="40" font-size="12" fill="#a0a0a0">"NO INTERNET"</text>
    <rect x="40" y="52" width="140" height="64" rx="10" fill="#f2c94c"/>
    <text x="110" y="89" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Browser</text>
    <rect x="540" y="52" width="140" height="64" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="610" y="89" font-size="15" fill="#a0a0a0" text-anchor="middle">Server</text>
    <line x1="186" y1="84" x2="284" y2="84" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="292" y1="76" x2="308" y2="92" stroke="#e5484d" stroke-width="3"/>
    <line x1="292" y1="92" x2="308" y2="76" stroke="#e5484d" stroke-width="3"/>
    <text x="239" y="74" font-size="12" fill="#e5484d" text-anchor="middle">Request</text>
    <text x="370" y="112" font-size="12" fill="#a0a0a0" text-anchor="middle">The request never leaves your device.</text>

    <line x1="40" y1="140" x2="680" y2="140" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Row 2: 404 Not Found -->
    <text x="40" y="168" font-size="12" fill="#a0a0a0">"404 NOT FOUND"</text>
    <rect x="40" y="180" width="140" height="64" rx="10" fill="#f2c94c"/>
    <text x="110" y="217" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Browser</text>
    <rect x="540" y="180" width="140" height="64" rx="10" fill="#4f6bd8"/>
    <text x="610" y="217" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Server</text>

    <line x1="186" y1="200" x2="532" y2="200" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="202" y="178" width="74" height="18" rx="9" fill="#141414"/>
    <text x="239" y="191" font-size="12" fill="#f2c94c" text-anchor="middle">1. Request</text>

    <line x1="534" y1="226" x2="188" y2="226" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="442" y="232" width="84" height="18" rx="9" fill="#141414"/>
    <text x="484" y="245" font-size="12" fill="#8ea2ff" text-anchor="middle">2. Response</text>
    <text x="300" y="245" font-size="12" fill="#a0a0a0" text-anchor="middle">"I don't have that page."</text>

    <text x="360" y="284" font-size="12" fill="#a0a0a0" text-anchor="middle">The trip worked. The server answered with an error.</text>
  </g>
</svg>
