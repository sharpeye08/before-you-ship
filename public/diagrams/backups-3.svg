<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">The 3-2-1 rule for a small web app</title>
  <desc id="d">Account A, at your main provider, holds copy 1, the live database, and copy 2, the provider's automatic backups. Account B, at a different provider, holds copy 3, your own regular export. If account A is lost, account B still has a copy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Account A -->
    <text x="24" y="38" font-size="12" fill="#a0a0a0">ACCOUNT A (your main provider)</text>
    <rect x="24" y="50" width="420" height="190" rx="10" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="48" y="80" width="170" height="70" rx="10" fill="#f2c94c"/>
    <text x="133" y="111" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Live database</text>
    <text x="133" y="131" font-size="12" fill="#111111" text-anchor="middle">copy 1</text>
    <rect x="250" y="80" width="170" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="335" y="111" font-size="15" fill="#f2f2f2" text-anchor="middle">Automatic backups</text>
    <text x="335" y="131" font-size="12" fill="#a0a0a0" text-anchor="middle">copy 2</text>
    <line x1="220" y1="115" x2="244" y2="115" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Account B -->
    <text x="476" y="38" font-size="12" fill="#a0a0a0">ACCOUNT B (a different provider)</text>
    <rect x="476" y="50" width="220" height="190" rx="10" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="500" y="80" width="172" height="70" rx="10" fill="#1f9d6b"/>
    <text x="586" y="111" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Your own export</text>
    <text x="586" y="131" font-size="12" fill="#e6f6ef" text-anchor="middle">copy 3, off-site</text>

    <!-- Export arrow -->
    <path d="M133 154 L133 200 L586 200 L586 158" fill="none" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="190" width="120" height="20" rx="10" fill="#141414"/>
    <text x="360" y="204" font-size="12" fill="#f2c94c" text-anchor="middle">regular export</text>

    <text x="360" y="272" font-size="12" fill="#a0a0a0" text-anchor="middle">3 copies, 2 types of storage, 1 off-site. If account A is lost, account B still has a copy.</text>
  </g>
</svg>
