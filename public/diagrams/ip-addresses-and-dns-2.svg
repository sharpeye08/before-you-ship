<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">A DNS lookup</title>
  <desc id="d">Your browser asks a DNS server for the IP address of www.example.com. The DNS server answers 203.0.113.10. Then the browser sends its request to the server at 203.0.113.10.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Browser -->
    <text x="110" y="44" font-size="12" fill="#a0a0a0" text-anchor="middle">YOU</text>
    <rect x="40" y="58" width="140" height="96" rx="10" fill="#f2c94c"/>
    <text x="110" y="100" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Browser</text>
    <text x="110" y="122" font-size="12" fill="#111111" text-anchor="middle">knows the name</text>

    <!-- DNS server -->
    <rect x="540" y="58" width="140" height="96" rx="10" fill="#1f9d6b"/>
    <text x="610" y="100" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">DNS server</text>
    <text x="610" y="122" font-size="12" fill="#e6f7ef" text-anchor="middle">finds the number</text>

    <!-- 1. Question -->
    <line x1="186" y1="86" x2="532" y2="86" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="198" y="64" width="86" height="18" rx="9" fill="#141414"/>
    <text x="241" y="77" font-size="12" fill="#f2c94c" text-anchor="middle">1. Question</text>
    <text x="420" y="77" font-size="12" fill="#a0a0a0" text-anchor="middle">"IP address of www.example.com?"</text>

    <!-- 2. Answer -->
    <line x1="534" y1="128" x2="188" y2="128" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="446" y="134" width="76" height="18" rx="9" fill="#141414"/>
    <text x="484" y="147" font-size="12" fill="#6fd3a8" text-anchor="middle">2. Answer</text>
    <text x="300" y="147" font-size="12" fill="#a0a0a0" text-anchor="middle">"It's 203.0.113.10"</text>

    <!-- 3. Request to the real server -->
    <path d="M110 160 L110 254 L532 254" fill="none" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="276" y="232" width="86" height="18" rx="9" fill="#141414"/>
    <text x="319" y="245" font-size="12" fill="#f2c94c" text-anchor="middle">3. Request</text>
    <text x="319" y="276" font-size="12" fill="#a0a0a0" text-anchor="middle">Now the browser knows where to send it</text>

    <!-- Website server -->
    <rect x="540" y="214" width="140" height="80" rx="10" fill="#4f6bd8"/>
    <text x="610" y="248" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Server</text>
    <text x="610" y="270" font-size="12" fill="#e8ecff" text-anchor="middle">203.0.113.10</text>
  </g>
</svg>
