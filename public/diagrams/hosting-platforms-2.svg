<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Preview link and live site</title>
  <desc id="d">You push a dark mode branch and open a pull request. The platform builds it at its own preview link, where you test it. Visitors still see the live site from the main branch. When you merge the pull request into main, the live site gets the change.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Top row -->
    <rect x="40" y="44" width="180" height="64" rx="10" fill="#f2c94c"/>
    <text x="130" y="72" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Dark mode</text>
    <text x="130" y="92" font-size="12" fill="#111111" text-anchor="middle">a separate branch</text>

    <line x1="224" y1="76" x2="264" y2="76" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="270" y="44" width="180" height="64" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="82" font-size="15" fill="#f2f2f2" text-anchor="middle">Pull request</text>

    <line x1="454" y1="76" x2="494" y2="76" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="500" y="44" width="180" height="64" rx="10" fill="#4f6bd8"/>
    <text x="590" y="72" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Preview link</text>
    <text x="590" y="92" font-size="12" fill="#e8ecff" text-anchor="middle">its own address</text>
    <text x="590" y="130" font-size="12" fill="#a0a0a0" text-anchor="middle">You test here</text>

    <!-- Merge -->
    <line x1="360" y1="110" x2="360" y2="186" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="372" y="152" font-size="12" fill="#f2c94c">Merge</text>

    <!-- Bottom row -->
    <rect x="270" y="190" width="180" height="64" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="218" font-size="15" fill="#f2f2f2" text-anchor="middle">main</text>
    <text x="360" y="238" font-size="12" fill="#a0a0a0" text-anchor="middle">production branch</text>

    <line x1="454" y1="222" x2="494" y2="222" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="500" y="190" width="180" height="64" rx="10" fill="#1f9d6b"/>
    <text x="590" y="218" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Live site</text>
    <text x="590" y="238" font-size="12" fill="#dff5ec" text-anchor="middle">(production)</text>
    <text x="590" y="276" font-size="12" fill="#a0a0a0" text-anchor="middle">Visitors see this</text>
  </g>
</svg>
