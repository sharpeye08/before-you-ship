<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">What happens after each push</title>
  <desc id="d">You push to GitHub. Step 1: the platform builds your code into files for browsers. Step 2: a CDN copies pages, images, CSS and JavaScript to many countries. Step 3: backend code becomes functions that run when a request arrives. Step 4: your app gets a live address, like my-app.vercel.app.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="340" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Push -->
    <rect x="40" y="36" width="190" height="64" rx="10" fill="#f2c94c"/>
    <text x="135" y="65" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">You push</text>
    <text x="135" y="85" font-size="12" fill="#111111" text-anchor="middle">to GitHub</text>

    <line x1="234" y1="68" x2="282" y2="68" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Build -->
    <rect x="290" y="36" width="220" height="64" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="400" y="65" font-size="15" fill="#f2f2f2" text-anchor="middle">1. Build</text>
    <text x="400" y="85" font-size="12" fill="#a0a0a0" text-anchor="middle">code becomes files for browsers</text>

    <line x1="360" y1="102" x2="290" y2="146" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="440" y1="102" x2="510" y2="146" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- CDN -->
    <rect x="150" y="150" width="220" height="84" rx="10" fill="#1f9d6b"/>
    <text x="260" y="180" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">2. CDN</text>
    <text x="260" y="202" font-size="12" fill="#dff5ec" text-anchor="middle">Pages, images, CSS, JS</text>
    <text x="260" y="220" font-size="12" fill="#dff5ec" text-anchor="middle">copied to many countries</text>

    <!-- Functions -->
    <rect x="390" y="150" width="220" height="84" rx="10" fill="#4f6bd8"/>
    <text x="500" y="180" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">3. Functions</text>
    <text x="500" y="202" font-size="12" fill="#e8ecff" text-anchor="middle">Backend code that runs</text>
    <text x="500" y="220" font-size="12" fill="#e8ecff" text-anchor="middle">when a request arrives</text>

    <line x1="290" y1="236" x2="340" y2="266" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="470" y1="236" x2="420" y2="266" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Live address -->
    <rect x="200" y="270" width="320" height="50" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="300" font-size="15" fill="#f2f2f2" text-anchor="middle">4. Live address: my-app.vercel.app</text>
  </g>
</svg>
