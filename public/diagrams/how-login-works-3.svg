<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="t d">
  <title id="t">The three parts of a JWT</title>
  <desc id="d">A JWT has three parts with dots between them. The header names the signing method. The payload holds the data, such as user ID 17, and anyone can read it. The signature is made with the server's secret key. If anyone changes the payload, the signature does not match and the server rejects the token.</desc>
  <rect width="720" height="270" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="360" y="40" font-size="12" fill="#a0a0a0" text-anchor="middle">header . payload . signature</text>

    <rect x="30" y="58" width="190" height="100" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="125" y="98" font-size="15" fill="#f2f2f2" text-anchor="middle">Header</text>
    <text x="125" y="122" font-size="12" fill="#a0a0a0" text-anchor="middle">the signing method</text>

    <text x="235" y="116" font-size="28" fill="#cfcfcf" text-anchor="middle">.</text>

    <rect x="250" y="58" width="220" height="100" rx="10" fill="#f2c94c"/>
    <text x="360" y="98" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Payload</text>
    <text x="360" y="122" font-size="12" fill="#111111" text-anchor="middle">{"userId":17}</text>
    <text x="360" y="142" font-size="12" fill="#111111" text-anchor="middle">anyone can read it</text>

    <text x="485" y="116" font-size="28" fill="#cfcfcf" text-anchor="middle">.</text>

    <rect x="500" y="58" width="190" height="100" rx="10" fill="#4f6bd8"/>
    <text x="595" y="98" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Signature</text>
    <text x="595" y="122" font-size="12" fill="#e8ecff" text-anchor="middle">made with the</text>
    <text x="595" y="140" font-size="12" fill="#e8ecff" text-anchor="middle">server's secret key</text>

    <rect x="30" y="186" width="660" height="60" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="212" font-size="12" fill="#a0a0a0" text-anchor="middle">Change one character of the payload, and the signature does not match.</text>
    <text x="360" y="232" font-size="12" fill="#a0a0a0" text-anchor="middle">The server rejects the token. Never put secrets in the payload.</text>
  </g>
</svg>
