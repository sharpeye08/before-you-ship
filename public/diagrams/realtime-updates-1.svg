<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d">
  <title id="t">The browser always speaks first</title>
  <desc id="d">Leo's browser sends a request, and the server sends back a response. The server has Mia's new message, but it cannot start a conversation to tell Leo's browser about it. In HTTP, the server can only answer a request.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="280" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Browser -->
    <rect x="40" y="56" width="170" height="84" rx="10" fill="#f2c94c"/>
    <text x="125" y="103" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Leo's browser</text>

    <!-- Server -->
    <rect x="510" y="56" width="170" height="84" rx="10" fill="#4f6bd8"/>
    <text x="595" y="94" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Server</text>
    <text x="595" y="116" font-size="12" fill="#e8ecff" text-anchor="middle">has Mia's message</text>

    <!-- Request -->
    <line x1="216" y1="80" x2="502" y2="80" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="232" y="58" width="74" height="18" rx="9" fill="#141414"/>
    <text x="269" y="71" font-size="12" fill="#f2c94c" text-anchor="middle">1. Request</text>

    <!-- Response -->
    <line x1="504" y1="118" x2="218" y2="118" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="412" y="124" width="84" height="18" rx="9" fill="#141414"/>
    <text x="454" y="137" font-size="12" fill="#8ea2ff" text-anchor="middle">2. Response</text>

    <!-- Blocked: server cannot start -->
    <line x1="595" y1="146" x2="595" y2="196" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="595" y1="196" x2="384" y2="196" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="358" y1="188" x2="374" y2="204" stroke="#e5484d" stroke-width="3"/>
    <line x1="358" y1="204" x2="374" y2="188" stroke="#e5484d" stroke-width="3"/>
    <text x="490" y="186" font-size="12" fill="#e5484d" text-anchor="middle">"Mia just wrote something!"</text>

    <text x="360" y="240" font-size="15" fill="#f2f2f2" text-anchor="middle">In HTTP, the server cannot start the conversation.</text>
    <text x="360" y="262" font-size="12" fill="#a0a0a0" text-anchor="middle">It can only answer a request from the browser.</text>
  </g>
</svg>
