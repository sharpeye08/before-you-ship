<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Four AWS building blocks</title>
  <desc id="d">Your app can use four AWS building blocks. EC2 is a computer that is always on. S3 is storage for files like pictures. RDS is a database that AWS looks after. Lambda is code that runs only when it is needed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Your app -->
    <rect x="260" y="30" width="200" height="60" rx="10" fill="#f2c94c"/>
    <text x="360" y="58" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Your app</text>
    <text x="360" y="77" font-size="12" fill="#111111" text-anchor="middle">picks the blocks it needs</text>

    <!-- Lines -->
    <line x1="320" y1="92" x2="118" y2="170" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="345" y1="92" x2="282" y2="170" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="375" y1="92" x2="438" y2="170" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="400" y1="92" x2="602" y2="170" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- EC2 -->
    <rect x="40" y="176" width="145" height="96" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="112" y="206" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">EC2</text>
    <text x="112" y="232" font-size="12" fill="#a0a0a0" text-anchor="middle">A computer that</text>
    <text x="112" y="250" font-size="12" fill="#a0a0a0" text-anchor="middle">is always on</text>

    <!-- S3 -->
    <rect x="205" y="176" width="145" height="96" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="277" y="206" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">S3</text>
    <text x="277" y="232" font-size="12" fill="#a0a0a0" text-anchor="middle">Storage for files</text>
    <text x="277" y="250" font-size="12" fill="#a0a0a0" text-anchor="middle">like pictures</text>

    <!-- RDS -->
    <rect x="370" y="176" width="145" height="96" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="442" y="206" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">RDS</text>
    <text x="442" y="232" font-size="12" fill="#a0a0a0" text-anchor="middle">A database that</text>
    <text x="442" y="250" font-size="12" fill="#a0a0a0" text-anchor="middle">AWS looks after</text>

    <!-- Lambda -->
    <rect x="535" y="176" width="145" height="96" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="607" y="206" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Lambda</text>
    <text x="607" y="232" font-size="12" fill="#a0a0a0" text-anchor="middle">Code that runs</text>
    <text x="607" y="250" font-size="12" fill="#a0a0a0" text-anchor="middle">only when needed</text>
  </g>
</svg>
