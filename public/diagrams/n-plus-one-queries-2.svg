<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">Promise.all fills the connection pool</title>
  <desc id="d">One page sends 100 queries at the same time. They use every open connection in the connection pool. Queries from other visitors must wait in line until a connection is free.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- One page -->
    <rect x="30" y="50" width="180" height="100" rx="10" fill="#f08a4b"/>
    <text x="120" y="94" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">One page</text>
    <text x="120" y="116" font-size="12" fill="#111111" text-anchor="middle">100 queries at once</text>

    <!-- Pool -->
    <rect x="270" y="50" width="180" height="100" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="82" font-size="15" fill="#f2f2f2" text-anchor="middle">Connection pool</text>
    <rect x="285" y="98" width="20" height="16" rx="3" fill="#f08a4b"/>
    <rect x="311" y="98" width="20" height="16" rx="3" fill="#f08a4b"/>
    <rect x="337" y="98" width="20" height="16" rx="3" fill="#f08a4b"/>
    <rect x="363" y="98" width="20" height="16" rx="3" fill="#f08a4b"/>
    <rect x="389" y="98" width="20" height="16" rx="3" fill="#f08a4b"/>
    <rect x="415" y="98" width="20" height="16" rx="3" fill="#f08a4b"/>
    <text x="360" y="136" font-size="12" fill="#a0a0a0" text-anchor="middle">every connection in use</text>

    <!-- Database -->
    <rect x="510" y="50" width="180" height="100" rx="10" fill="#4f6bd8"/>
    <text x="600" y="94" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Database</text>
    <text x="600" y="116" font-size="12" fill="#e8ecff" text-anchor="middle">still 100 queries</text>

    <line x1="212" y1="100" x2="262" y2="100" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="452" y1="100" x2="502" y2="100" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Other visitors -->
    <rect x="270" y="212" width="180" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="242" font-size="15" fill="#f2f2f2" text-anchor="middle">Other visitors</text>
    <text x="360" y="264" font-size="12" fill="#a0a0a0" text-anchor="middle">their queries wait in line</text>
    <line x1="360" y1="210" x2="360" y2="158" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowRed)"/>

    <text x="600" y="240" font-size="12" fill="#a0a0a0" text-anchor="middle">One page may load faster,</text>
    <text x="600" y="258" font-size="12" fill="#a0a0a0" text-anchor="middle">but the whole app can get slower.</text>
  </g>
</svg>
