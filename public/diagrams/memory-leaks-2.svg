<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">What the garbage collector keeps and frees</title>
  <desc id="d">Top row: the roots point to a Map at the top of a file, and the Map holds old profiles. The garbage collector can reach them, so it keeps them forever. This is a leak. Bottom row: data from a finished request has no path from a root, so the garbage collector frees it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="30" y="44" font-size="12" fill="#a0a0a0">CAN BE REACHED: KEPT</text>
    <rect x="30" y="56" width="170" height="70" rx="10" fill="#f2c94c"/>
    <text x="115" y="86" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Roots</text>
    <text x="115" y="107" font-size="12" fill="#111111" text-anchor="middle">module-level variables</text>

    <rect x="270" y="56" width="180" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="86" font-size="15" fill="#f2f2f2" text-anchor="middle">The cache Map</text>
    <text x="360" y="107" font-size="12" fill="#a0a0a0" text-anchor="middle">never removes entries</text>

    <rect x="520" y="56" width="170" height="70" rx="10" fill="#f08a4b"/>
    <text x="605" y="86" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Old profiles</text>
    <text x="605" y="107" font-size="12" fill="#111111" text-anchor="middle">kept forever: a leak</text>

    <line x1="200" y1="91" x2="266" y2="91" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="450" y1="91" x2="516" y2="91" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="30" y="184" font-size="12" fill="#a0a0a0">CANNOT BE REACHED: FREED</text>
    <rect x="30" y="196" width="170" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="115" y="226" font-size="15" fill="#f2f2f2" text-anchor="middle">Request data</text>
    <text x="115" y="247" font-size="12" fill="#a0a0a0" text-anchor="middle">no path from a root</text>

    <line x1="200" y1="231" x2="516" y2="231" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="358" y="221" font-size="12" fill="#a0a0a0" text-anchor="middle">garbage collector</text>

    <rect x="520" y="196" width="170" height="70" rx="10" fill="#1f9d6b"/>
    <text x="605" y="226" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Freed</text>
    <text x="605" y="247" font-size="12" fill="#e6f5ee" text-anchor="middle">memory comes back</text>

    <text x="360" y="300" font-size="12" fill="#a0a0a0" text-anchor="middle">The garbage collector keeps everything a root can reach, even data you never use again.</text>
  </g>
</svg>
