<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="t d">
  <title id="t">A deadlock: a circle of waiting</title>
  <desc id="d">Request A holds the lock on Maya's wallet and waits for the lock on Leo's wallet. Request B holds the lock on Leo's wallet and waits for the lock on Maya's wallet. Each request waits for the other, so neither can continue.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="310" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Request A -->
    <rect x="40" y="110" width="170" height="80" rx="10" fill="#f2c94c"/>
    <text x="125" y="145" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Request A</text>
    <text x="125" y="167" font-size="12" fill="#111111" text-anchor="middle">Maya sends Leo $20</text>

    <!-- Request B -->
    <rect x="510" y="110" width="170" height="80" rx="10" fill="#4f6bd8"/>
    <text x="595" y="145" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Request B</text>
    <text x="595" y="167" font-size="12" fill="#e8ecff" text-anchor="middle">Leo sends Maya $5</text>

    <!-- Wallet locks -->
    <rect x="270" y="50" width="180" height="60" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="86" font-size="15" fill="#f2f2f2" text-anchor="middle">Maya's wallet lock</text>
    <rect x="270" y="190" width="180" height="60" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="226" font-size="15" fill="#f2f2f2" text-anchor="middle">Leo's wallet lock</text>

    <!-- A holds Maya, waits for Leo -->
    <line x1="210" y1="128" x2="266" y2="86" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="232" y="96" font-size="12" fill="#a0a0a0" text-anchor="end">holds</text>
    <line x1="210" y1="172" x2="266" y2="214" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <text x="232" y="214" font-size="12" fill="#e5484d" text-anchor="end">waits for</text>

    <!-- B holds Leo, waits for Maya -->
    <line x1="510" y1="172" x2="454" y2="214" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="488" y="214" font-size="12" fill="#a0a0a0">holds</text>
    <line x1="510" y1="128" x2="454" y2="86" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <text x="488" y="96" font-size="12" fill="#e5484d">waits for</text>

    <text x="360" y="285" font-size="12" fill="#a0a0a0" text-anchor="middle">Each request holds one lock and waits for the other. Neither can continue.</text>
  </g>
</svg>
