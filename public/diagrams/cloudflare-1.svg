<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">A visit without and with Cloudflare</title>
  <desc id="d">Without Cloudflare, DNS answers with your server's address, 203.0.113.10, and the visitor goes directly to your server. With Cloudflare, DNS answers with a Cloudflare address. The visitor goes to the nearest Cloudflare data center, which checks the request and answers from its cache if it can. Cloudflare contacts your server only when needed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="330" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Row 1: without Cloudflare -->
    <text x="24" y="40" font-size="12" fill="#a0a0a0">WITHOUT CLOUDFLARE: DNS ANSWERS WITH YOUR SERVER'S ADDRESS</text>
    <rect x="24" y="54" width="120" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="84" y="94" font-size="15" fill="#f2f2f2" text-anchor="middle">Visitor</text>

    <rect x="556" y="54" width="140" height="70" rx="10" fill="#4f6bd8"/>
    <text x="626" y="86" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Your server</text>
    <text x="626" y="106" font-size="12" fill="#e8ecff" text-anchor="middle">203.0.113.10</text>

    <line x1="148" y1="89" x2="548" y2="89" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="348" y="79" font-size="12" fill="#a0a0a0" text-anchor="middle">every request goes directly to your server</text>

    <!-- Row 2: with Cloudflare -->
    <text x="24" y="180" font-size="12" fill="#a0a0a0">WITH CLOUDFLARE: DNS ANSWERS WITH A CLOUDFLARE ADDRESS</text>
    <rect x="24" y="196" width="120" height="92" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="84" y="247" font-size="15" fill="#f2f2f2" text-anchor="middle">Visitor</text>

    <rect x="232" y="196" width="220" height="92" rx="10" fill="#f08a4b"/>
    <text x="342" y="224" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Nearest Cloudflare</text>
    <text x="342" y="244" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">data center</text>
    <text x="342" y="268" font-size="12" fill="#111111" text-anchor="middle">checks, answers from cache</text>

    <rect x="556" y="196" width="140" height="92" rx="10" fill="#4f6bd8"/>
    <text x="626" y="238" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Your server</text>
    <text x="626" y="258" font-size="12" fill="#e8ecff" text-anchor="middle">203.0.113.10</text>

    <line x1="148" y1="242" x2="224" y2="242" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="186" y="232" font-size="12" fill="#f2c94c" text-anchor="middle">visit</text>
    <line x1="456" y1="242" x2="548" y2="242" stroke="#cfcfcf" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="502" y="216" font-size="12" fill="#a0a0a0" text-anchor="middle">only when</text>
    <text x="502" y="232" font-size="12" fill="#a0a0a0" text-anchor="middle">needed</text>
  </g>
</svg>
