<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">An install script steals secrets</title>
  <desc id="d">You run npm install. The package arrives from the registry. Its postinstall script runs automatically. The script reads your .env file and sends your API keys to the attacker's server. You never imported the package, and your app still works.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Top row -->
    <rect x="30" y="40" width="180" height="80" rx="10" fill="#f2c94c"/>
    <text x="120" y="76" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">npm install</text>
    <text x="120" y="98" font-size="12" fill="#111111" text-anchor="middle">you run it</text>

    <rect x="270" y="40" width="180" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="76" font-size="15" fill="#f2f2f2" text-anchor="middle">Package arrives</text>
    <text x="360" y="98" font-size="12" fill="#a0a0a0" text-anchor="middle">from the registry</text>

    <rect x="510" y="40" width="180" height="80" rx="10" fill="#f08a4b"/>
    <text x="600" y="76" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">postinstall runs</text>
    <text x="600" y="98" font-size="12" fill="#111111" text-anchor="middle">automatically</text>

    <line x1="212" y1="80" x2="262" y2="80" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="452" y1="80" x2="502" y2="80" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="600" y1="122" x2="600" y2="172" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Bottom row -->
    <rect x="510" y="180" width="180" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="600" y="216" font-size="15" fill="#f2f2f2" text-anchor="middle">Reads your .env</text>
    <text x="600" y="238" font-size="12" fill="#a0a0a0" text-anchor="middle">and other secrets</text>

    <rect x="270" y="180" width="180" height="80" rx="10" fill="#e5484d"/>
    <text x="360" y="216" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Attacker's server</text>
    <text x="360" y="238" font-size="12" fill="#fde8e8" text-anchor="middle">gets your API keys</text>

    <line x1="508" y1="220" x2="458" y2="220" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>

    <text x="30" y="206" font-size="12" fill="#a0a0a0">You never imported</text>
    <text x="30" y="222" font-size="12" fill="#a0a0a0">the package.</text>
    <text x="30" y="238" font-size="12" fill="#a0a0a0">Your app still works.</text>

    <text x="360" y="296" font-size="12" fill="#a0a0a0" text-anchor="middle">All of this happens before you write one line that uses the package.</text>
  </g>
</svg>
