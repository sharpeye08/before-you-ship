<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="t d">
  <title id="t">The debugging method</title>
  <desc id="d">Seven steps in order. Step 0: stop the damage with a rollback. Step 1: read the logs for the exact error. Step 2: reproduce the bug on purpose. Step 3: narrow it down, for example with git bisect. Step 4: form a hypothesis in one sentence. Step 5: fix the cause with a small change. Step 6: add a test so the bug can't come back. Guessing a fix skips steps 1 to 4.</desc>
  <rect width="720" height="270" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="40" y="40" font-size="12" fill="#a0a0a0">FOLLOW THE STEPS IN ORDER</text>
    <line x1="60" y1="90" x2="660" y2="90" stroke="#3a3a3a" stroke-width="2"/>

    <!-- Step circles -->
    <circle cx="60" cy="90" r="22" fill="#f08a4b"/>
    <text x="60" y="95" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">0</text>
    <circle cx="160" cy="90" r="22" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="160" y="95" font-size="15" fill="#f2f2f2" text-anchor="middle">1</text>
    <circle cx="260" cy="90" r="22" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="260" y="95" font-size="15" fill="#f2f2f2" text-anchor="middle">2</text>
    <circle cx="360" cy="90" r="22" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="95" font-size="15" fill="#f2f2f2" text-anchor="middle">3</text>
    <circle cx="460" cy="90" r="22" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="460" y="95" font-size="15" fill="#f2f2f2" text-anchor="middle">4</text>
    <circle cx="560" cy="90" r="22" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="560" y="95" font-size="15" fill="#f2f2f2" text-anchor="middle">5</text>
    <circle cx="660" cy="90" r="22" fill="#1f9d6b"/>
    <text x="660" y="95" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">6</text>

    <!-- Labels -->
    <g font-size="15" fill="#f2f2f2" text-anchor="middle">
      <text x="60" y="144">Stop the</text><text x="60" y="163">damage</text>
      <text x="160" y="144">Read the</text><text x="160" y="163">logs</text>
      <text x="260" y="144">Reproduce</text><text x="260" y="163">it</text>
      <text x="360" y="144">Narrow it</text><text x="360" y="163">down</text>
      <text x="460" y="144">Form a</text><text x="460" y="163">hypothesis</text>
      <text x="560" y="144">Fix the</text><text x="560" y="163">cause</text>
      <text x="660" y="144">Add a</text><text x="660" y="163">test</text>
    </g>
    <g font-size="12" fill="#a0a0a0" text-anchor="middle">
      <text x="60" y="190">roll back</text>
      <text x="160" y="190">exact error</text>
      <text x="260" y="190">on purpose</text>
      <text x="360" y="190">git bisect</text>
      <text x="460" y="190">one sentence</text>
      <text x="560" y="190">small change</text>
      <text x="660" y="190">no return</text>
    </g>

    <!-- Guessing skips -->
    <path d="M160 222 L160 232 L460 232 L460 222" fill="none" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="310" y="254" font-size="12" fill="#e5484d" text-anchor="middle">Guessing a fix skips steps 1 to 4.</text>
  </g>
</svg>
