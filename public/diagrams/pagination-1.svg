<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="t d">
  <title id="t">Offset and cursor pagination</title>
  <desc id="d">Top: offset pagination reads 40,000 rows and throws them away, then returns 20 rows. The work grows with the page number. Bottom: cursor pagination starts right after the bookmark and reads only the next 20 rows. The work stays the same on every page.</desc>
  <rect width="720" height="290" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Offset -->
    <text x="40" y="40" font-size="12" fill="#a0a0a0">OFFSET: SKIP 40,000, THEN RETURN 20</text>
    <rect x="40" y="56" width="540" height="44" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="310" y="83" font-size="15" fill="#f2f2f2" text-anchor="middle">40,000 rows read, then thrown away</text>
    <rect x="590" y="56" width="90" height="44" rx="10" fill="#f08a4b"/>
    <text x="635" y="83" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">20 rows</text>
    <text x="40" y="124" font-size="12" fill="#a0a0a0">The work grows with the page number.</text>

    <!-- Cursor -->
    <text x="40" y="170" font-size="12" fill="#a0a0a0">CURSOR: START RIGHT AFTER THE BOOKMARK</text>
    <rect x="40" y="186" width="530" height="44" rx="10" fill="#141414" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="305" y="213" font-size="15" fill="#a0a0a0" text-anchor="middle">earlier rows: not read</text>
    <rect x="574" y="180" width="10" height="56" rx="2" fill="#e98da4"/>
    <rect x="590" y="186" width="90" height="44" rx="10" fill="#1f9d6b"/>
    <text x="635" y="213" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">20 rows</text>
    <text x="40" y="258" font-size="12" fill="#a0a0a0">The work stays the same on every page.</text>
    <text x="579" y="258" font-size="12" fill="#e98da4" text-anchor="middle">bookmark</text>
  </g>
</svg>
