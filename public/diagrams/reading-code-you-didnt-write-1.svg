<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">It works is not it is safe</title>
  <desc id="d">The invite route checks only login. You invite someone to your own team 7, and the invite is created, which is correct. A stranger who is not in team 7 sends the same request, and the invite is also created, but the route must refuse it. A click through the happy path shows only the first case.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="330" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="30" y="44" font-size="12" fill="#a0a0a0">HAPPY PATH</text>
    <rect x="30" y="56" width="160" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="110" y="92" font-size="15" fill="#f2f2f2" text-anchor="middle">You</text>
    <text x="110" y="114" font-size="12" fill="#a0a0a0" text-anchor="middle">admin of team 7</text>

    <text x="30" y="194" font-size="12" fill="#a0a0a0">WHAT YOU DID NOT TRY</text>
    <rect x="30" y="206" width="160" height="80" rx="10" fill="#1f1f1f" stroke="#e5484d" stroke-width="2"/>
    <text x="110" y="242" font-size="15" fill="#f2f2f2" text-anchor="middle">Stranger</text>
    <text x="110" y="264" font-size="12" fill="#a0a0a0" text-anchor="middle">not in team 7</text>

    <rect x="280" y="56" width="160" height="230" rx="10" fill="#4f6bd8"/>
    <text x="360" y="164" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Invite route</text>
    <text x="360" y="186" font-size="12" fill="#e8ecff" text-anchor="middle">checks login only</text>

    <rect x="530" y="56" width="160" height="80" rx="10" fill="#1f9d6b"/>
    <text x="610" y="92" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Invite created</text>
    <text x="610" y="114" font-size="12" fill="#e6fff4" text-anchor="middle">correct</text>

    <rect x="530" y="206" width="160" height="80" rx="10" fill="#1f1f1f" stroke="#e5484d" stroke-width="2"/>
    <text x="610" y="242" font-size="15" fill="#f2f2f2" text-anchor="middle">Invite created</text>
    <text x="610" y="264" font-size="12" fill="#e5484d" text-anchor="middle">must be refused</text>

    <line x1="196" y1="96" x2="274" y2="96" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="235" y="86" font-size="12" fill="#a0a0a0" text-anchor="middle">team 7</text>
    <line x1="446" y1="96" x2="524" y2="96" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <line x1="196" y1="246" x2="274" y2="246" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="235" y="236" font-size="12" fill="#a0a0a0" text-anchor="middle">team 7</text>
    <line x1="446" y1="246" x2="524" y2="246" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="360" y="314" font-size="12" fill="#a0a0a0" text-anchor="middle">When you click through the preview, you only see the top row.</text>
  </g>
</svg>
