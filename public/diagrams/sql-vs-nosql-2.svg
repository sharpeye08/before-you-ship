<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Posts with authors: many reads or one join</title>
  <desc id="d">Left: in Firestore, which has no joins, the page reads 50 posts and then 50 author documents, about 100 billed reads. Right: in a relational database, the page sends one query with a join and gets the posts with their authors back.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Firestore -->
    <text x="40" y="40" font-size="12" fill="#a0a0a0">FIRESTORE: NO JOINS</text>
    <rect x="40" y="92" width="110" height="56" rx="10" fill="#f2c94c"/>
    <text x="95" y="125" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Page</text>
    <rect x="200" y="60" width="140" height="50" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="270" y="90" font-size="15" fill="#f2f2f2" text-anchor="middle">1. 50 posts</text>
    <rect x="200" y="132" width="140" height="50" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="270" y="162" font-size="15" fill="#f2f2f2" text-anchor="middle">2. 50 authors</text>
    <line x1="156" y1="110" x2="194" y2="88" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="156" y1="130" x2="194" y2="154" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="190" y="224" font-size="15" fill="#f08a4b" text-anchor="middle">about 100 billed reads</text>

    <line x1="370" y1="40" x2="370" y2="250" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Relational -->
    <text x="400" y="40" font-size="12" fill="#a0a0a0">RELATIONAL: ONE JOIN</text>
    <rect x="400" y="92" width="110" height="56" rx="10" fill="#f2c94c"/>
    <text x="455" y="125" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Page</text>
    <rect x="550" y="82" width="130" height="76" rx="10" fill="#4f6bd8"/>
    <text x="615" y="116" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">One query</text>
    <text x="615" y="138" font-size="12" fill="#e8ecff" text-anchor="middle">with a join</text>
    <line x1="516" y1="110" x2="544" y2="110" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="544" y1="132" x2="516" y2="132" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="540" y="224" font-size="15" fill="#1f9d6b" text-anchor="middle">posts and authors together</text>

    <text x="360" y="278" font-size="12" fill="#a0a0a0" text-anchor="middle">Firestore bills each document read. That is why apps copy author names into each post.</text>
  </g>
</svg>
