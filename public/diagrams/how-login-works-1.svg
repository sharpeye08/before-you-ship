<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">Store a hash, not the password</title>
  <desc id="d">At sign-up, the password goes through a hash function with a salt, and the database stores only the hash. At login, the typed password goes through the hash function with the same salt. The server then checks if the new hash matches the stored hash.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="340" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Sign-up row -->
    <text x="30" y="40" font-size="12" fill="#a0a0a0">SIGN-UP</text>
    <rect x="30" y="54" width="170" height="80" rx="10" fill="#f2c94c"/>
    <text x="115" y="90" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Password</text>
    <text x="115" y="112" font-size="12" fill="#111111" text-anchor="middle">"sunshine2024"</text>
    <line x1="204" y1="94" x2="242" y2="94" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="250" y="54" width="190" height="80" rx="10" fill="#4f6bd8"/>
    <text x="345" y="90" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Hash function</text>
    <text x="345" y="112" font-size="12" fill="#e8ecff" text-anchor="middle">with a new random salt</text>
    <line x1="444" y1="94" x2="482" y2="94" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="490" y="54" width="200" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="590" y="90" font-size="15" fill="#f2f2f2" text-anchor="middle">Database</text>
    <text x="590" y="112" font-size="12" fill="#a0a0a0" text-anchor="middle">stores only the hash</text>

    <!-- Login row -->
    <text x="30" y="200" font-size="12" fill="#a0a0a0">LOGIN</text>
    <rect x="30" y="214" width="170" height="80" rx="10" fill="#f2c94c"/>
    <text x="115" y="250" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Typed password</text>
    <text x="115" y="272" font-size="12" fill="#111111" text-anchor="middle">"sunshine2024"</text>
    <line x1="204" y1="254" x2="242" y2="254" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="250" y="214" width="190" height="80" rx="10" fill="#4f6bd8"/>
    <text x="345" y="250" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Hash function</text>
    <text x="345" y="272" font-size="12" fill="#e8ecff" text-anchor="middle">with the same salt</text>
    <line x1="444" y1="254" x2="482" y2="254" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="490" y="214" width="200" height="80" rx="10" fill="#1f9d6b"/>
    <text x="590" y="250" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Do the hashes</text>
    <text x="590" y="270" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">match?</text>

    <!-- Stored hash goes down to the check -->
    <line x1="590" y1="138" x2="590" y2="206" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="602" y="178" font-size="12" fill="#a0a0a0">stored hash</text>

    <text x="30" y="324" font-size="12" fill="#a0a0a0">The real password is never stored, and a hash cannot be turned back into it.</text>
  </g>
</svg>
