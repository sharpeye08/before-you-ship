<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d">
  <title id="t">One export blocks everyone</title>
  <desc id="d">The main thread runs a login, then 8 seconds of CSV export work. A health check and a homepage request arrive during the export. They must wait until the export finishes, and only then does the main thread run them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="280" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="40" y="40" font-size="12" fill="#a0a0a0">MAIN THREAD</text>
    <rect x="40" y="54" width="62" height="44" rx="8" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="71" y="81" font-size="12" fill="#f2f2f2" text-anchor="middle">login</text>
    <rect x="108" y="54" width="420" height="44" rx="8" fill="#f08a4b"/>
    <text x="318" y="81" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">CSV export: 8 seconds of work</text>
    <rect x="534" y="54" width="70" height="44" rx="8" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="569" y="81" font-size="12" fill="#f2f2f2" text-anchor="middle">health</text>
    <rect x="610" y="54" width="70" height="44" rx="8" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="645" y="81" font-size="12" fill="#f2f2f2" text-anchor="middle">home</text>

    <!-- Waiting requests -->
    <text x="170" y="138" font-size="12" fill="#a0a0a0">health check arrives</text>
    <line x1="170" y1="150" x2="562" y2="150" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="569" y1="150" x2="569" y2="106" stroke="#e5484d" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="260" y="186" font-size="12" fill="#a0a0a0">homepage request arrives</text>
    <line x1="260" y1="198" x2="638" y2="198" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="645" y1="198" x2="645" y2="106" stroke="#e5484d" stroke-width="2" marker-end="url(#arrowRed)"/>

    <!-- Time -->
    <line x1="40" y1="230" x2="690" y2="230" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="108" y="250" font-size="12" fill="#a0a0a0" text-anchor="middle">0 s</text>
    <text x="528" y="250" font-size="12" fill="#a0a0a0" text-anchor="middle">8 s</text>
    <text x="690" y="250" font-size="12" fill="#a0a0a0" text-anchor="end">time</text>
    <text x="360" y="270" font-size="12" fill="#a0a0a0" text-anchor="middle">While one piece of JavaScript runs, every other request waits.</text>
  </g>
</svg>
