<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">The cloud is someone else's computers</title>
  <desc id="d">Your phone reaches a data center over the internet. The data center belongs to a cloud provider. Inside it are computers that people rent: one runs your app, one keeps your files, and another runs someone else's app.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- You -->
    <text x="120" y="88" font-size="12" fill="#a0a0a0" text-anchor="middle">YOU</text>
    <rect x="40" y="100" width="160" height="80" rx="10" fill="#f2c94c"/>
    <text x="120" y="136" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Your phone</text>
    <text x="120" y="156" font-size="12" fill="#111111" text-anchor="middle">"Save my game"</text>

    <!-- Internet -->
    <rect x="270" y="115" width="140" height="50" rx="25" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="340" y="145" font-size="15" fill="#f2f2f2" text-anchor="middle">Internet</text>

    <line x1="204" y1="140" x2="264" y2="140" stroke="#cfcfcf" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="414" y1="140" x2="462" y2="140" stroke="#cfcfcf" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- Data center -->
    <rect x="470" y="30" width="210" height="226" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="575" y="54" font-size="12" fill="#a0a0a0" text-anchor="middle">DATA CENTER</text>
    <text x="575" y="76" font-size="15" fill="#f2f2f2" text-anchor="middle">Cloud provider</text>
    <rect x="490" y="96" width="170" height="40" rx="10" fill="#4f6bd8"/>
    <text x="575" y="121" font-size="15" fill="#f2f2f2" text-anchor="middle">Your app</text>
    <rect x="490" y="146" width="170" height="40" rx="10" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="575" y="171" font-size="15" fill="#f2f2f2" text-anchor="middle">Your files</text>
    <rect x="490" y="196" width="170" height="40" rx="10" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="575" y="221" font-size="15" fill="#f2f2f2" text-anchor="middle">Someone else's app</text>

    <text x="360" y="284" font-size="12" fill="#a0a0a0" text-anchor="middle">"The cloud" means computers in a data center that you rent and reach over the internet.</text>
  </g>
</svg>
