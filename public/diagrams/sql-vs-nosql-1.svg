<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">One fact once, or a copy in each document</title>
  <desc id="d">Left: in a relational database, the users table has rows for Mia, Leo and Sam, and each row points to one row in the teams table, where the name Morning Runners is stored once. To rename the team, you change one row. Right: in a document database, the documents for Mia, Leo and Sam each hold their own copy of the team name. To rename the team, you must change every copy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Relational -->
    <text x="40" y="40" font-size="12" fill="#a0a0a0">RELATIONAL: STORED ONCE</text>
    <rect x="40" y="60" width="130" height="170" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="60" y="82" font-size="12" fill="#a0a0a0">users</text>
    <text x="60" y="114" font-size="15" fill="#f2f2f2">Mia</text>
    <text x="60" y="150" font-size="15" fill="#f2f2f2">Leo</text>
    <text x="60" y="186" font-size="15" fill="#f2f2f2">Sam</text>
    <rect x="200" y="100" width="150" height="80" rx="10" fill="#1f9d6b"/>
    <text x="216" y="122" font-size="12" fill="#e6fff4">teams</text>
    <text x="275" y="150" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Morning Runners</text>
    <text x="275" y="170" font-size="12" fill="#e6fff4" text-anchor="middle">stored once</text>
    <line x1="110" y1="109" x2="192" y2="128" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="110" y1="145" x2="192" y2="145" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="110" y1="181" x2="192" y2="162" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="40" y="262" font-size="12" fill="#1f9d6b">New team name: change 1 row.</text>

    <line x1="370" y1="40" x2="370" y2="280" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Document -->
    <text x="400" y="40" font-size="12" fill="#a0a0a0">DOCUMENT: A COPY IN EACH</text>
    <rect x="400" y="60" width="280" height="50" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="416" y="90" font-size="15" fill="#f2f2f2">Mia · <tspan fill="#f08a4b">Morning Runners</tspan></text>
    <rect x="400" y="122" width="280" height="50" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="416" y="152" font-size="15" fill="#f2f2f2">Leo · <tspan fill="#f08a4b">Morning Runners</tspan></text>
    <rect x="400" y="184" width="280" height="50" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="416" y="214" font-size="15" fill="#f2f2f2">Sam · <tspan fill="#f08a4b">Morning Runners</tspan></text>
    <text x="400" y="262" font-size="12" fill="#f08a4b">New team name: change every copy.</text>

    <text x="360" y="302" font-size="12" fill="#a0a0a0" text-anchor="middle">The folder is quicker to read. The cabinet is easier to keep correct.</text>
  </g>
</svg>
