<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Processes and threads</title>
  <desc id="d">Process A has its own memory and three threads. All three threads share that memory. Process B has its own separate memory and one thread. The two processes can't see each other's memory.</desc>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Process A -->
    <rect x="30" y="40" width="400" height="200" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="50" y="70" font-size="15" font-weight="600" fill="#f2f2f2">Process A</text>
    <rect x="50" y="86" width="360" height="40" rx="8" fill="#4f6bd8"/>
    <text x="230" y="111" font-size="15" fill="#f2f2f2" text-anchor="middle">Memory (shared by its threads)</text>
    <line x1="102" y1="128" x2="102" y2="160" stroke="#cfcfcf" stroke-width="2"/>
    <line x1="230" y1="128" x2="230" y2="160" stroke="#cfcfcf" stroke-width="2"/>
    <line x1="358" y1="128" x2="358" y2="160" stroke="#cfcfcf" stroke-width="2"/>
    <rect x="50" y="160" width="104" height="50" rx="8" fill="#f2c94c"/>
    <text x="102" y="190" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Thread 1</text>
    <rect x="178" y="160" width="104" height="50" rx="8" fill="#f2c94c"/>
    <text x="230" y="190" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Thread 2</text>
    <rect x="306" y="160" width="104" height="50" rx="8" fill="#f2c94c"/>
    <text x="358" y="190" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Thread 3</text>

    <!-- Process B -->
    <rect x="470" y="40" width="220" height="200" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="490" y="70" font-size="15" font-weight="600" fill="#f2f2f2">Process B</text>
    <rect x="490" y="86" width="180" height="40" rx="8" fill="#4f6bd8"/>
    <text x="580" y="111" font-size="15" fill="#f2f2f2" text-anchor="middle">Its own memory</text>
    <line x1="580" y1="128" x2="580" y2="160" stroke="#cfcfcf" stroke-width="2"/>
    <rect x="528" y="160" width="104" height="50" rx="8" fill="#f2c94c"/>
    <text x="580" y="190" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Thread 1</text>

    <text x="360" y="272" font-size="12" fill="#a0a0a0" text-anchor="middle">Threads in one process share its memory. Two processes can't see each other's memory.</text>
  </g>
</svg>
