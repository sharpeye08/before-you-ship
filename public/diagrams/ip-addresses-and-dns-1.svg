<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="t d">
  <title id="t">The parts of a domain name</title>
  <desc id="d">The domain name www.example.com has three parts with dots between them. Read from right to left: com is the ending, called the top-level domain. example is the main name. www is an extra part that the owner added.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="250" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- www -->
    <rect x="60" y="40" width="160" height="64" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="140" y="78" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">www</text>
    <text x="250" y="82" font-size="28" fill="#cfcfcf" text-anchor="middle">.</text>

    <!-- example -->
    <rect x="280" y="40" width="160" height="64" rx="10" fill="#4f6bd8"/>
    <text x="360" y="78" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">example</text>
    <text x="470" y="82" font-size="28" fill="#cfcfcf" text-anchor="middle">.</text>

    <!-- com -->
    <rect x="500" y="40" width="160" height="64" rx="10" fill="#f2c94c"/>
    <text x="580" y="78" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">com</text>

    <!-- Labels -->
    <text x="140" y="136" font-size="15" fill="#f2f2f2" text-anchor="middle">Extra part</text>
    <text x="140" y="156" font-size="12" fill="#a0a0a0" text-anchor="middle">added by the owner</text>
    <text x="360" y="136" font-size="15" fill="#f2f2f2" text-anchor="middle">Main name</text>
    <text x="360" y="156" font-size="12" fill="#a0a0a0" text-anchor="middle">rented by the owner</text>
    <text x="580" y="136" font-size="15" fill="#f2f2f2" text-anchor="middle">Ending</text>
    <text x="580" y="156" font-size="12" fill="#a0a0a0" text-anchor="middle">the top-level domain</text>

    <!-- Read direction -->
    <line x1="660" y1="192" x2="68" y2="192" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="222" font-size="12" fill="#a0a0a0" text-anchor="middle">Read from right to left: from the biggest part to the smallest</text>
  </g>
</svg>
