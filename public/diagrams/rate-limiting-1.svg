<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">A counter for one visitor</title>
  <desc id="d">The limit is 5 login attempts per IP address per 15 minutes. One IP address makes 7 attempts in one window. Attempts 1 to 5 are allowed. Attempts 6 and 7 get status code 429 Too Many Requests. When the 15-minute window ends, the count resets to 0.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="24" y="40" font-size="12" fill="#a0a0a0">LIMIT: 5 LOGIN ATTEMPTS PER IP ADDRESS PER 15 MINUTES</text>

    <!-- Allowed attempts -->
    <rect x="24" y="56" width="86" height="76" rx="10" fill="#1f9d6b"/>
    <text x="67" y="92" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Try 1</text>
    <text x="67" y="114" font-size="12" fill="#e6f6ef" text-anchor="middle">allowed</text>
    <rect x="120" y="56" width="86" height="76" rx="10" fill="#1f9d6b"/>
    <text x="163" y="92" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Try 2</text>
    <text x="163" y="114" font-size="12" fill="#e6f6ef" text-anchor="middle">allowed</text>
    <rect x="216" y="56" width="86" height="76" rx="10" fill="#1f9d6b"/>
    <text x="259" y="92" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Try 3</text>
    <text x="259" y="114" font-size="12" fill="#e6f6ef" text-anchor="middle">allowed</text>
    <rect x="312" y="56" width="86" height="76" rx="10" fill="#1f9d6b"/>
    <text x="355" y="92" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Try 4</text>
    <text x="355" y="114" font-size="12" fill="#e6f6ef" text-anchor="middle">allowed</text>
    <rect x="408" y="56" width="86" height="76" rx="10" fill="#1f9d6b"/>
    <text x="451" y="92" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Try 5</text>
    <text x="451" y="114" font-size="12" fill="#e6f6ef" text-anchor="middle">allowed</text>

    <!-- Refused attempts -->
    <rect x="504" y="56" width="86" height="76" rx="10" fill="#e5484d"/>
    <text x="547" y="92" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Try 6</text>
    <text x="547" y="114" font-size="12" fill="#fde8e8" text-anchor="middle">429</text>
    <rect x="600" y="56" width="86" height="76" rx="10" fill="#e5484d"/>
    <text x="643" y="92" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Try 7</text>
    <text x="643" y="114" font-size="12" fill="#fde8e8" text-anchor="middle">429</text>

    <!-- Brackets -->
    <line x1="24" y1="148" x2="494" y2="148" stroke="#1f9d6b" stroke-width="2"/>
    <text x="259" y="168" font-size="12" fill="#a0a0a0" text-anchor="middle">counter: 5 of 5 used</text>
    <line x1="504" y1="148" x2="686" y2="148" stroke="#e5484d" stroke-width="2"/>
    <text x="595" y="168" font-size="12" fill="#a0a0a0" text-anchor="middle">over the limit: refused</text>

    <!-- Time window -->
    <line x1="24" y1="210" x2="686" y2="210" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="24" y="200" font-size="12" fill="#a0a0a0">time</text>
    <text x="686" y="200" font-size="12" fill="#a0a0a0" text-anchor="end">15 minutes later</text>
    <rect x="456" y="226" width="230" height="40" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="571" y="251" font-size="15" fill="#f2f2f2" text-anchor="middle">Count resets to 0</text>

    <text x="24" y="244" font-size="12" fill="#a0a0a0">429 = Too Many Requests.</text>
    <text x="24" y="262" font-size="12" fill="#a0a0a0">Retry-After can say how long to wait.</text>
  </g>
</svg>
