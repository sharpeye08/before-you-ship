<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d">
  <title id="t">A retry with an idempotency key</title>
  <desc id="d">Your server sends a charge with the key order-42-payment. Stripe charges 49 dollars and saves the result, but the answer is lost. Your server retries with the same key. Stripe has seen this key, so it returns the saved result and does not charge again. There is one charge.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="420" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <line x1="150" y1="86" x2="150" y2="376" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="570" y1="86" x2="570" y2="376" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="4 4"/>

    <rect x="60" y="30" width="180" height="56" rx="10" fill="#f2c94c"/>
    <text x="150" y="63" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Your server</text>
    <rect x="480" y="30" width="180" height="56" rx="10" fill="#4f6bd8"/>
    <text x="570" y="63" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Stripe</text>

    <line x1="150" y1="130" x2="564" y2="130" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="121" font-size="12" fill="#f2c94c" text-anchor="middle">1. Charge, key order-42-payment</text>

    <rect x="480" y="146" width="180" height="44" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="570" y="173" font-size="12" fill="#f2f2f2" text-anchor="middle">Charges $49, saves result</text>

    <line x1="564" y1="214" x2="300" y2="214" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowRed)"/>
    <text x="430" y="205" font-size="12" fill="#e5484d" text-anchor="middle">2. Answer lost</text>

    <line x1="150" y1="270" x2="564" y2="270" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="261" font-size="12" fill="#f2c94c" text-anchor="middle">3. Retry, same key</text>

    <rect x="480" y="286" width="180" height="44" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="570" y="313" font-size="12" fill="#f2f2f2" text-anchor="middle">Seen this key</text>

    <line x1="570" y1="356" x2="156" y2="356" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="347" font-size="12" fill="#8ea2ff" text-anchor="middle">4. Saved result: paid</text>

    <text x="360" y="400" font-size="15" font-weight="600" fill="#1f9d6b" text-anchor="middle">One charge of $49</text>
  </g>
</svg>
