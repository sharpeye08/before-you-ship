<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">The open back door</title>
  <desc id="d">Normal visitors go through Cloudflare, which checks each request, and then Cloudflare contacts your server. An attacker who knows your server's real IP address skips Cloudflare and sends requests directly to your server, so there is no DDoS protection and no firewall on that path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="330" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="24" y="40" width="140" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="94" y="80" font-size="15" fill="#f2f2f2" text-anchor="middle">Visitors</text>

    <rect x="290" y="40" width="160" height="70" rx="10" fill="#f08a4b"/>
    <text x="370" y="72" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Cloudflare</text>
    <text x="370" y="92" font-size="12" fill="#111111" text-anchor="middle">the guard checks</text>

    <rect x="556" y="120" width="140" height="80" rx="10" fill="#4f6bd8"/>
    <text x="626" y="156" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Your server</text>
    <text x="626" y="176" font-size="12" fill="#e8ecff" text-anchor="middle">real IP address</text>

    <rect x="24" y="210" width="140" height="70" rx="10" fill="#e5484d"/>
    <text x="94" y="250" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Attacker</text>

    <line x1="168" y1="75" x2="282" y2="75" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="454" y1="90" x2="552" y2="142" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <line x1="168" y1="245" x2="550" y2="186" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <text x="352" y="250" font-size="12" fill="#e5484d" text-anchor="middle">skips the guard: no DDoS protection,</text>
    <text x="352" y="266" font-size="12" fill="#e5484d" text-anchor="middle">no firewall</text>

    <text x="360" y="312" font-size="12" fill="#a0a0a0" text-anchor="middle">Fix: accept web traffic only from Cloudflare, or use Cloudflare Tunnel.</text>
  </g>
</svg>
