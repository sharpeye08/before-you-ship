<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">A useEffect loop that calls a paid API</title>
  <desc id="d">React draws the component. The effect runs after every render. The effect calls the paid AI API. Saving the result makes React draw the component again, so the loop starts again. With no dependency list, it never stops.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="330" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="60" y="40" width="200" height="76" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="160" y="74" font-size="15" fill="#f2f2f2" text-anchor="middle">1. React draws</text>
    <text x="160" y="96" font-size="12" fill="#a0a0a0" text-anchor="middle">the component</text>

    <rect x="460" y="40" width="200" height="76" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="560" y="74" font-size="15" fill="#f2f2f2" text-anchor="middle">2. Effect runs</text>
    <text x="560" y="96" font-size="12" fill="#a0a0a0" text-anchor="middle">after every render</text>

    <rect x="460" y="220" width="200" height="76" rx="10" fill="#f08a4b"/>
    <text x="560" y="254" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">3. Paid AI call</text>
    <text x="560" y="276" font-size="12" fill="#111111" text-anchor="middle">costs money each time</text>

    <rect x="60" y="220" width="200" height="76" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="160" y="254" font-size="15" fill="#f2f2f2" text-anchor="middle">4. Save result</text>
    <text x="160" y="276" font-size="12" fill="#a0a0a0" text-anchor="middle">setResult(data)</text>

    <line x1="266" y1="78" x2="454" y2="78" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="560" y1="122" x2="560" y2="214" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="454" y1="258" x2="266" y2="258" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="160" y1="214" x2="160" y2="122" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="172" y="172" font-size="12" fill="#e5484d">re-render</text>

    <text x="360" y="164" font-size="12" fill="#a0a0a0" text-anchor="middle">No dependency list:</text>
    <text x="360" y="182" font-size="12" fill="#a0a0a0" text-anchor="middle">the loop never stops</text>
  </g>
</svg>
