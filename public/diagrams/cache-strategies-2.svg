<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">A lock plus the stale copy stops the stampede</title>
  <desc id="d">Many requests find an old copy and try to take a lock in Redis. Only one request wins the lock and runs one query on the database. All other requests get the old copy right away.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="30" y="110" width="160" height="80" rx="10" fill="#f2c94c"/>
    <text x="110" y="145" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Many requests</text>
    <text x="110" y="167" font-size="12" fill="#111111" text-anchor="middle">the copy is old</text>

    <rect x="260" y="110" width="160" height="80" rx="10" fill="#1f9d6b"/>
    <text x="340" y="145" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Lock in Redis</text>
    <text x="340" y="167" font-size="12" fill="#e6f5ee" text-anchor="middle">only one request wins</text>

    <rect x="500" y="40" width="190" height="70" rx="10" fill="#4f6bd8"/>
    <text x="595" y="70" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Database</text>
    <text x="595" y="91" font-size="12" fill="#e8ecff" text-anchor="middle">one query</text>

    <rect x="500" y="190" width="190" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="595" y="220" font-size="15" fill="#f2f2f2" text-anchor="middle">Old copy</text>
    <text x="595" y="241" font-size="12" fill="#a0a0a0" text-anchor="middle">returned right away</text>

    <line x1="190" y1="150" x2="256" y2="150" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="420" y1="130" x2="496" y2="82" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="450" y="92" font-size="12" fill="#a0a0a0" text-anchor="end">winner</text>
    <line x1="420" y1="170" x2="496" y2="218" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="446" y="222" font-size="12" fill="#a0a0a0" text-anchor="end">everyone else</text>

    <text x="360" y="285" font-size="12" fill="#a0a0a0" text-anchor="middle">The database sees one query per expiry, and the other requests don't wait.</text>
  </g>
</svg>
