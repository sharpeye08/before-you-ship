<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Lock the class row</title>
  <desc id="d">Mia's transaction locks the class row, counts 19, inserts her booking and commits. Leo's transaction asks for the same lock and waits until Mia commits. Then Leo's count gets a fresh snapshot, sees 20, and he is told the class is full.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="30" y="97" font-size="15" fill="#f2f2f2">Mia</text>
    <text x="30" y="197" font-size="15" fill="#f2f2f2">Leo</text>

    <!-- Mia -->
    <rect x="80" y="70" width="140" height="44" rx="10" fill="#4f6bd8"/>
    <text x="150" y="97" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Lock class row</text>
    <rect x="235" y="70" width="160" height="44" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="315" y="97" font-size="15" fill="#f2f2f2" text-anchor="middle">Count 19, insert</text>
    <rect x="410" y="70" width="100" height="44" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="460" y="97" font-size="15" fill="#f2f2f2" text-anchor="middle">Commit</text>

    <!-- Leo -->
    <rect x="80" y="170" width="140" height="44" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="150" y="197" font-size="15" fill="#f2f2f2" text-anchor="middle">Ask for lock</text>
    <line x1="224" y1="192" x2="512" y2="192" stroke="#a0a0a0" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <rect x="300" y="182" width="136" height="20" rx="10" fill="#141414"/>
    <text x="368" y="196" font-size="12" fill="#a0a0a0" text-anchor="middle">waits for Mia</text>
    <rect x="520" y="170" width="180" height="44" rx="10" fill="#f2c94c"/>
    <text x="610" y="197" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Counts 20: full</text>

    <!-- Lock released -->
    <line x1="490" y1="116" x2="530" y2="164" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="540" y="140" font-size="12" fill="#a0a0a0">lock released</text>

    <text x="360" y="262" font-size="12" fill="#a0a0a0" text-anchor="middle">At Read Committed, each statement gets a fresh snapshot,</text>
    <text x="360" y="280" font-size="12" fill="#a0a0a0" text-anchor="middle">so Leo's count sees Mia's booking.</text>
  </g>
</svg>
