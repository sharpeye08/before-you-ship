<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">The tables of the recipe app</title>
  <desc id="d">Four tables. users has id, display_name and email. posts has id, user_id, title and body, and its user_id points to users. comments has id, post_id, user_id and body, and points to posts and users. likes has user_id and post_id, one row per like, and points to users and posts. Each arrow is a foreign key.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="360" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="40" y="44" font-size="12" fill="#a0a0a0">Each arrow is a foreign key</text>

    <!-- likes (top) -->
    <rect x="260" y="30" width="200" height="90" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="58" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">likes</text>
    <text x="360" y="82" font-size="12" fill="#a0a0a0" text-anchor="middle">user_id, post_id</text>
    <text x="360" y="100" font-size="12" fill="#a0a0a0" text-anchor="middle">one row per like</text>

    <!-- users (left) -->
    <rect x="40" y="140" width="190" height="90" rx="10" fill="#f2c94c"/>
    <text x="135" y="176" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">users</text>
    <text x="135" y="200" font-size="12" fill="#111111" text-anchor="middle">id, display_name, email</text>

    <!-- posts (right) -->
    <rect x="490" y="140" width="190" height="90" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="585" y="176" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">posts</text>
    <text x="585" y="200" font-size="12" fill="#a0a0a0" text-anchor="middle">id, user_id, title, body</text>

    <!-- comments (bottom) -->
    <rect x="260" y="250" width="200" height="90" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="286" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">comments</text>
    <text x="360" y="310" font-size="12" fill="#a0a0a0" text-anchor="middle">id, post_id, user_id, body</text>

    <!-- posts.user_id to users -->
    <line x1="486" y1="185" x2="236" y2="185" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="177" font-size="12" fill="#f2c94c" text-anchor="middle">user_id</text>

    <!-- likes to users and posts -->
    <line x1="258" y1="100" x2="182" y2="136" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="210" y="108" font-size="12" fill="#f2c94c" text-anchor="end">user_id</text>
    <line x1="462" y1="100" x2="538" y2="136" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="510" y="108" font-size="12" fill="#f2c94c">post_id</text>

    <!-- comments to users and posts -->
    <line x1="258" y1="280" x2="182" y2="234" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="210" y="278" font-size="12" fill="#f2c94c" text-anchor="end">user_id</text>
    <line x1="462" y1="280" x2="538" y2="234" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="510" y="278" font-size="12" fill="#f2c94c">post_id</text>
  </g>
</svg>
