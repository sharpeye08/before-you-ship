<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d">
  <title id="t">Four ways to hear about something new</title>
  <desc id="d">Polling: the browser asks "anything new?" again and again, and most answers are "nothing new". Long polling: the browser asks, the server waits until there is a new message, answers, and the browser asks again. Server-Sent Events: one request, then the server sends event after event. WebSockets: an upgrade request and a 101 Switching Protocols answer, then messages go both ways.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="420" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Lifelines -->
    <rect x="190" y="16" width="120" height="38" rx="10" fill="#f2c94c"/>
    <text x="250" y="40" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Browser</text>
    <rect x="580" y="16" width="120" height="38" rx="10" fill="#4f6bd8"/>
    <text x="640" y="40" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Server</text>
    <line x1="250" y1="56" x2="250" y2="404" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="640" y1="56" x2="640" y2="404" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Row dividers -->
    <line x1="40" y1="150" x2="680" y2="150" stroke="#2a2a2a" stroke-width="1"/>
    <line x1="40" y1="234" x2="680" y2="234" stroke="#2a2a2a" stroke-width="1"/>
    <line x1="40" y1="318" x2="680" y2="318" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Polling -->
    <text x="40" y="104" font-size="15" fill="#f2f2f2">Polling</text>
    <text x="40" y="122" font-size="12" fill="#a0a0a0">asks on a timer</text>
    <line x1="256" y1="86" x2="634" y2="86" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="395" y="78" width="100" height="16" rx="8" fill="#141414"/>
    <text x="445" y="90" font-size="12" fill="#f2c94c" text-anchor="middle">anything new?</text>
    <line x1="634" y1="104" x2="256" y2="104" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="401" y="96" width="88" height="16" rx="8" fill="#141414"/>
    <text x="445" y="108" font-size="12" fill="#a0a0a0" text-anchor="middle">nothing new</text>
    <line x1="256" y1="122" x2="634" y2="122" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="395" y="114" width="100" height="16" rx="8" fill="#141414"/>
    <text x="445" y="126" font-size="12" fill="#f2c94c" text-anchor="middle">anything new?</text>
    <line x1="634" y1="140" x2="256" y2="140" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="401" y="132" width="88" height="16" rx="8" fill="#141414"/>
    <text x="445" y="144" font-size="12" fill="#8ea2ff" text-anchor="middle">new message</text>

    <!-- Long polling -->
    <text x="40" y="188" font-size="15" fill="#f2f2f2">Long polling</text>
    <text x="40" y="206" font-size="12" fill="#a0a0a0">server holds the request</text>
    <line x1="256" y1="170" x2="634" y2="170" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="395" y="162" width="100" height="16" rx="8" fill="#141414"/>
    <text x="445" y="174" font-size="12" fill="#f2c94c" text-anchor="middle">anything new?</text>
    <rect x="636" y="172" width="8" height="34" rx="3" fill="#f08a4b"/>
    <text x="626" y="193" font-size="12" fill="#a0a0a0" text-anchor="end">the server waits</text>
    <line x1="634" y1="206" x2="256" y2="206" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="401" y="198" width="88" height="16" rx="8" fill="#141414"/>
    <text x="445" y="210" font-size="12" fill="#8ea2ff" text-anchor="middle">new message</text>
    <line x1="256" y1="224" x2="634" y2="224" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="395" y="216" width="100" height="16" rx="8" fill="#141414"/>
    <text x="445" y="228" font-size="12" fill="#f2c94c" text-anchor="middle">anything new?</text>

    <!-- Server-Sent Events -->
    <text x="40" y="272" font-size="15" fill="#f2f2f2">Server-Sent Events</text>
    <text x="40" y="290" font-size="12" fill="#a0a0a0">server to browser only</text>
    <line x1="256" y1="254" x2="634" y2="254" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="401" y="246" width="88" height="16" rx="8" fill="#141414"/>
    <text x="445" y="258" font-size="12" fill="#f2c94c" text-anchor="middle">one request</text>
    <line x1="634" y1="272" x2="256" y2="272" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="420" y="264" width="50" height="16" rx="8" fill="#141414"/>
    <text x="445" y="276" font-size="12" fill="#8ea2ff" text-anchor="middle">event</text>
    <line x1="634" y1="290" x2="256" y2="290" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="420" y="282" width="50" height="16" rx="8" fill="#141414"/>
    <text x="445" y="294" font-size="12" fill="#8ea2ff" text-anchor="middle">event</text>
    <line x1="634" y1="308" x2="256" y2="308" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="420" y="300" width="50" height="16" rx="8" fill="#141414"/>
    <text x="445" y="312" font-size="12" fill="#8ea2ff" text-anchor="middle">event</text>

    <!-- WebSockets -->
    <text x="40" y="356" font-size="15" fill="#f2f2f2">WebSockets</text>
    <text x="40" y="374" font-size="12" fill="#a0a0a0">both ways, any time</text>
    <line x1="256" y1="338" x2="634" y2="338" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="378" y="330" width="134" height="16" rx="8" fill="#141414"/>
    <text x="445" y="342" font-size="12" fill="#f2c94c" text-anchor="middle">Upgrade: websocket</text>
    <line x1="634" y1="356" x2="256" y2="356" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="362" y="348" width="166" height="16" rx="8" fill="#141414"/>
    <text x="445" y="360" font-size="12" fill="#8ea2ff" text-anchor="middle">101 Switching Protocols</text>
    <line x1="256" y1="374" x2="634" y2="374" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="414" y="366" width="62" height="16" rx="8" fill="#141414"/>
    <text x="445" y="378" font-size="12" fill="#f2c94c" text-anchor="middle">message</text>
    <line x1="634" y1="392" x2="256" y2="392" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="414" y="384" width="62" height="16" rx="8" fill="#141414"/>
    <text x="445" y="396" font-size="12" fill="#8ea2ff" text-anchor="middle">message</text>
  </g>
</svg>
