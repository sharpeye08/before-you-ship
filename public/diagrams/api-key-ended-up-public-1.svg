<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">Two roads to a public key</title>
  <desc id="d">Your secret key can become public in two ways. On road 1, it gets into frontend code, and every visitor's browser downloads it. On road 2, it gets into a Git commit in a public repository, where programs search for keys within minutes. In both cases the key is public, and you must rotate it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="330" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Key -->
    <rect x="30" y="125" width="130" height="80" rx="10" fill="#f2c94c"/>
    <text x="95" y="161" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Your secret</text>
    <text x="95" y="181" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">key</text>

    <!-- Road 1 -->
    <text x="200" y="40" font-size="12" fill="#a0a0a0">ROAD 1</text>
    <rect x="200" y="50" width="160" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="280" y="86" font-size="15" fill="#f2f2f2" text-anchor="middle">Frontend code</text>
    <text x="280" y="108" font-size="12" fill="#a0a0a0" text-anchor="middle">or a public name</text>
    <rect x="400" y="50" width="170" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="485" y="86" font-size="15" fill="#f2f2f2" text-anchor="middle">Every visitor's</text>
    <text x="485" y="106" font-size="15" fill="#f2f2f2" text-anchor="middle">browser</text>

    <!-- Road 2 -->
    <text x="200" y="190" font-size="12" fill="#a0a0a0">ROAD 2</text>
    <rect x="200" y="200" width="160" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="280" y="236" font-size="15" fill="#f2f2f2" text-anchor="middle">A Git commit</text>
    <text x="280" y="258" font-size="12" fill="#a0a0a0" text-anchor="middle">even an old one</text>
    <rect x="400" y="200" width="170" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="485" y="236" font-size="15" fill="#f2f2f2" text-anchor="middle">Public repository</text>
    <text x="485" y="258" font-size="12" fill="#a0a0a0" text-anchor="middle">searched within minutes</text>

    <!-- Public -->
    <rect x="610" y="125" width="90" height="80" rx="10" fill="#e5484d"/>
    <text x="655" y="161" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Public</text>
    <text x="655" y="183" font-size="12" fill="#fde8e8" text-anchor="middle">rotate it</text>

    <!-- Arrows -->
    <line x1="164" y1="150" x2="194" y2="104" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="164" y1="180" x2="194" y2="226" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="364" y1="90" x2="392" y2="90" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="364" y1="240" x2="392" y2="240" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="574" y1="100" x2="606" y2="146" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="574" y1="230" x2="606" y2="184" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="30" y="314" font-size="12" fill="#a0a0a0">Published is published. You cannot take it back, so turn off the old key.</text>
  </g>
</svg>
