<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
  <title id="t">Before and after a background job</title>
  <desc id="d">Before: the route saves the user, sends the email, makes the picture, writes the AI tip and only then replies, so the user waits about 10 seconds. After: the route saves the user, adds a job and replies, so the user waits milliseconds. A worker sends the email, makes the picture and writes the tip later.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="380" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="30" y="96" font-size="15" font-weight="600" fill="#f2f2f2">Before</text>
    <rect x="140" y="70" width="40" height="40" rx="6" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="160" y="94" font-size="12" fill="#f2f2f2" text-anchor="middle">Save</text>
    <rect x="182" y="70" width="118" height="40" rx="6" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="241" y="94" font-size="12" fill="#f2f2f2" text-anchor="middle">Email</text>
    <rect x="302" y="70" width="108" height="40" rx="6" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="356" y="94" font-size="12" fill="#f2f2f2" text-anchor="middle">Picture</text>
    <rect x="412" y="70" width="216" height="40" rx="6" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="520" y="94" font-size="12" fill="#f2f2f2" text-anchor="middle">AI tip</text>
    <rect x="630" y="70" width="60" height="40" rx="6" fill="#f2c94c"/>
    <text x="660" y="94" font-size="12" font-weight="600" fill="#111111" text-anchor="middle">Reply</text>
    <line x1="142" y1="128" x2="688" y2="128" stroke="#cfcfcf" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="415" y="150" font-size="12" fill="#a0a0a0" text-anchor="middle">The user waits about 10 seconds</text>

    <line x1="30" y1="180" x2="690" y2="180" stroke="#3a3a3a" stroke-width="1"/>

    <text x="30" y="236" font-size="15" font-weight="600" fill="#f2f2f2">After</text>
    <rect x="140" y="210" width="40" height="40" rx="6" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="160" y="234" font-size="12" fill="#f2f2f2" text-anchor="middle">Save</text>
    <rect x="182" y="210" width="66" height="40" rx="6" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="215" y="234" font-size="12" fill="#f2f2f2" text-anchor="middle">Add job</text>
    <rect x="250" y="210" width="60" height="40" rx="6" fill="#f2c94c"/>
    <text x="280" y="234" font-size="12" font-weight="600" fill="#111111" text-anchor="middle">Reply</text>
    <line x1="142" y1="268" x2="308" y2="268" stroke="#cfcfcf" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="225" y="290" font-size="12" fill="#a0a0a0" text-anchor="middle">The user waits milliseconds</text>

    <text x="30" y="336" font-size="12" fill="#a0a0a0">Worker, later:</text>
    <rect x="320" y="310" width="118" height="40" rx="6" fill="#4f6bd8"/>
    <text x="379" y="334" font-size="12" fill="#f2f2f2" text-anchor="middle">Email</text>
    <rect x="440" y="310" width="80" height="40" rx="6" fill="#4f6bd8"/>
    <text x="480" y="334" font-size="12" fill="#f2f2f2" text-anchor="middle">Picture</text>
    <rect x="522" y="310" width="168" height="40" rx="6" fill="#4f6bd8"/>
    <text x="606" y="334" font-size="12" fill="#f2f2f2" text-anchor="middle">AI tip</text>
  </g>
</svg>
