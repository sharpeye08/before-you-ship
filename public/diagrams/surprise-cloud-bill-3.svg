<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">Layers that stop a big bill</title>
  <desc id="d">A request from a user or a bot first meets your server's checks: login, a per-user limit, a size limit and a daily cap. Then it meets the AI provider's hard limit. Only then does it add to your bill. A budget alert only warns you, and it can arrive late.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="330" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="260" y="46" font-size="12" fill="#a0a0a0" text-anchor="middle">FIRST PROTECTION</text>
    <text x="465" y="46" font-size="12" fill="#a0a0a0" text-anchor="middle">FINAL PROTECTION</text>

    <rect x="30" y="60" width="100" height="160" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="80" y="132" font-size="15" fill="#f2f2f2" text-anchor="middle">Request</text>
    <text x="80" y="154" font-size="12" fill="#a0a0a0" text-anchor="middle">user or bot</text>

    <rect x="170" y="60" width="180" height="160" rx="10" fill="#4f6bd8"/>
    <text x="260" y="96" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Your server</text>
    <text x="260" y="130" font-size="12" fill="#e8ecff" text-anchor="middle">login</text>
    <text x="260" y="150" font-size="12" fill="#e8ecff" text-anchor="middle">per-user limit</text>
    <text x="260" y="170" font-size="12" fill="#e8ecff" text-anchor="middle">size limit</text>
    <text x="260" y="190" font-size="12" fill="#e8ecff" text-anchor="middle">daily cap</text>

    <rect x="390" y="60" width="150" height="160" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="465" y="120" font-size="15" fill="#f2f2f2" text-anchor="middle">AI provider</text>
    <text x="465" y="144" font-size="12" fill="#a0a0a0" text-anchor="middle">hard limit:</text>
    <text x="465" y="162" font-size="12" fill="#a0a0a0" text-anchor="middle">requests fail</text>

    <rect x="580" y="60" width="110" height="160" rx="10" fill="#f2c94c"/>
    <text x="635" y="132" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Your bill</text>
    <text x="635" y="154" font-size="12" fill="#111111" text-anchor="middle">the meter</text>

    <line x1="134" y1="140" x2="164" y2="140" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="354" y1="140" x2="384" y2="140" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="544" y1="140" x2="574" y2="140" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <line x1="635" y1="224" x2="635" y2="250" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="480" y="256" width="210" height="56" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="585" y="280" font-size="15" fill="#f2f2f2" text-anchor="middle">Alert: only warns</text>
    <text x="585" y="300" font-size="12" fill="#a0a0a0" text-anchor="middle">and can arrive late</text>
  </g>
</svg>
