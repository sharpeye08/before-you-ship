<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">Two places errors show up</title>
  <desc id="d">The browser sends a request to the server. The server crashes and sends back status 500. The browser's Console only shows that the request failed. The terminal where the server runs shows why: the full error with its stack trace.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Browser -->
    <rect x="40" y="40" width="230" height="100" rx="10" fill="#f2c94c"/>
    <text x="155" y="84" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Browser</text>
    <text x="155" y="106" font-size="12" fill="#111111" text-anchor="middle">(frontend)</text>

    <!-- Server -->
    <rect x="450" y="40" width="230" height="100" rx="10" fill="#4f6bd8"/>
    <text x="565" y="84" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Server</text>
    <text x="565" y="106" font-size="12" fill="#e8ecff" text-anchor="middle">(backend)</text>

    <!-- Request and response -->
    <line x1="276" y1="70" x2="444" y2="70" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="60" font-size="12" fill="#f2c94c" text-anchor="middle">1. Request</text>
    <line x1="444" y1="112" x2="276" y2="112" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="132" font-size="12" fill="#e5484d" text-anchor="middle">2. Status 500</text>

    <!-- Down to the two places -->
    <line x1="155" y1="142" x2="155" y2="178" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="565" y1="142" x2="565" y2="178" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Console -->
    <rect x="40" y="184" width="230" height="90" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="60" y="212" font-size="15" fill="#f2f2f2">Console</text>
    <text x="60" y="236" font-size="12" fill="#a0a0a0">Failed to load resource:</text>
    <text x="60" y="254" font-size="12" fill="#e5484d">... a status of 500</text>

    <!-- Terminal -->
    <rect x="450" y="184" width="230" height="90" rx="10" fill="#1f1f1f" stroke="#1f9d6b" stroke-width="1.5"/>
    <text x="470" y="212" font-size="15" fill="#f2f2f2">Terminal</text>
    <text x="470" y="236" font-size="12" fill="#a0a0a0">TypeError: Cannot read ...</text>
    <text x="470" y="254" font-size="12" fill="#a0a0a0">at showWinner (scores.js:3:36)</text>

    <!-- Notes -->
    <text x="155" y="298" font-size="12" fill="#a0a0a0" text-anchor="middle">Shows THAT it failed</text>
    <text x="565" y="298" font-size="12" fill="#1f9d6b" text-anchor="middle">Shows WHY it failed</text>
  </g>
</svg>
