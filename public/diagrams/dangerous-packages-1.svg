<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t d">
  <title id="t">The software supply chain</title>
  <desc id="d">Your app uses two packages that you chose. Those packages bring in their own dependencies, which you never chose. One dependency has a bad author, so bad code can reach your app through a package you trust.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="370" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="105" y="34" font-size="12" fill="#a0a0a0" text-anchor="middle">YOUR PROJECT</text>
    <text x="355" y="34" font-size="12" fill="#a0a0a0" text-anchor="middle">PACKAGES YOU CHOSE</text>
    <text x="610" y="34" font-size="12" fill="#a0a0a0" text-anchor="middle">THEIR DEPENDENCIES</text>

    <!-- Your app -->
    <rect x="30" y="150" width="150" height="80" rx="10" fill="#f2c94c"/>
    <text x="105" y="186" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Your app</text>
    <text x="105" y="208" font-size="12" fill="#111111" text-anchor="middle">and your secrets</text>

    <!-- Packages -->
    <rect x="270" y="80" width="170" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="355" y="112" font-size="15" fill="#f2f2f2" text-anchor="middle">Package A</text>
    <text x="355" y="132" font-size="12" fill="#a0a0a0" text-anchor="middle">you installed it</text>

    <rect x="270" y="230" width="170" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="355" y="262" font-size="15" fill="#f2f2f2" text-anchor="middle">Package B</text>
    <text x="355" y="282" font-size="12" fill="#a0a0a0" text-anchor="middle">you installed it</text>

    <!-- Dependencies -->
    <rect x="530" y="56" width="160" height="60" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="610" y="82" font-size="15" fill="#f2f2f2" text-anchor="middle">Dependency</text>
    <text x="610" y="100" font-size="12" fill="#a0a0a0" text-anchor="middle">you never chose it</text>

    <rect x="530" y="156" width="160" height="60" rx="10" fill="#e5484d"/>
    <text x="610" y="182" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Bad dependency</text>
    <text x="610" y="200" font-size="12" fill="#fde8e8" text-anchor="middle">one bad author</text>

    <rect x="530" y="256" width="160" height="60" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="610" y="282" font-size="15" fill="#f2f2f2" text-anchor="middle">Dependency</text>
    <text x="610" y="300" font-size="12" fill="#a0a0a0" text-anchor="middle">you never chose it</text>

    <!-- Arrows -->
    <line x1="182" y1="178" x2="264" y2="122" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="182" y1="202" x2="264" y2="254" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="442" y1="104" x2="524" y2="88" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="442" y1="128" x2="524" y2="180" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <line x1="442" y1="265" x2="524" y2="282" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="360" y="350" font-size="12" fill="#a0a0a0" text-anchor="middle">When you install one package, you trust every author below it too.</text>
  </g>
</svg>
