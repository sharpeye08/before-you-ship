<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">Same code, different values</title>
  <desc id="d">On your laptop and in production, your app runs the same code: process.env.WEATHER_API_KEY. On your laptop, the value comes from your .env file when the app starts. In production, the value comes from the hosting platform's Environment Variables page. The code is the same. Only the value changes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="330" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="190" y="40" font-size="12" fill="#a0a0a0" text-anchor="middle">ON YOUR LAPTOP</text>
    <text x="530" y="40" font-size="12" fill="#a0a0a0" text-anchor="middle">IN PRODUCTION</text>

    <!-- Sources -->
    <rect x="50" y="54" width="280" height="72" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="190" y="84" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">.env file</text>
    <text x="190" y="106" font-size="12" fill="#a0a0a0" text-anchor="middle">WEATHER_API_KEY=wk-not-a-real-key-123</text>

    <rect x="390" y="54" width="280" height="72" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="530" y="84" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Environment Variables page</text>
    <text x="530" y="106" font-size="12" fill="#a0a0a0" text-anchor="middle">on the hosting platform: another key</text>

    <!-- Arrows -->
    <line x1="190" y1="132" x2="190" y2="176" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="202" y="159" font-size="12" fill="#a0a0a0">when the app starts</text>
    <line x1="530" y1="132" x2="530" y2="176" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="542" y="159" font-size="12" fill="#a0a0a0">when the app starts</text>

    <!-- Apps -->
    <rect x="50" y="184" width="280" height="84" rx="10" fill="#f2c94c"/>
    <text x="190" y="218" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Your app</text>
    <text x="190" y="242" font-size="12" fill="#111111" text-anchor="middle">reads process.env.WEATHER_API_KEY</text>

    <rect x="390" y="184" width="280" height="84" rx="10" fill="#4f6bd8"/>
    <text x="530" y="218" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Your app</text>
    <text x="530" y="242" font-size="12" fill="#e8ecff" text-anchor="middle">reads process.env.WEATHER_API_KEY</text>

    <text x="360" y="304" font-size="15" fill="#f2f2f2" text-anchor="middle">The code is the same. Only the value changes.</text>
  </g>
</svg>
