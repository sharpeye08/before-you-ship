<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">Publish once, every subscriber gets a copy</title>
  <desc id="d">The order service publishes one order placed event to the message broker and goes back to work. The broker delivers a copy of the event to each of four consumers: email, warehouse, loyalty and analytics. The order service does not wait for them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="360" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="105" y="36" font-size="12" fill="#a0a0a0" text-anchor="middle">PRODUCER</text>
    <text x="360" y="36" font-size="12" fill="#a0a0a0" text-anchor="middle">BROKER</text>
    <text x="600" y="36" font-size="12" fill="#a0a0a0" text-anchor="middle">CONSUMERS</text>

    <!-- Producer -->
    <rect x="30" y="145" width="150" height="70" rx="10" fill="#f2c94c"/>
    <text x="105" y="177" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Order service</text>
    <text x="105" y="197" font-size="12" fill="#111111" text-anchor="middle">saves the order</text>

    <!-- Broker -->
    <rect x="280" y="130" width="160" height="100" rx="10" fill="#4f6bd8"/>
    <text x="360" y="170" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Message broker</text>
    <text x="360" y="192" font-size="12" fill="#e8ecff" text-anchor="middle">topic: "orders"</text>
    <text x="360" y="210" font-size="12" fill="#e8ecff" text-anchor="middle">stores the event</text>

    <!-- Consumers -->
    <rect x="520" y="54" width="160" height="48" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="600" y="83" font-size="15" fill="#f2f2f2" text-anchor="middle">Email</text>
    <rect x="520" y="130" width="160" height="48" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="600" y="159" font-size="15" fill="#f2f2f2" text-anchor="middle">Warehouse</text>
    <rect x="520" y="206" width="160" height="48" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="600" y="235" font-size="15" fill="#f2f2f2" text-anchor="middle">Loyalty</text>
    <rect x="520" y="282" width="160" height="48" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="600" y="311" font-size="15" fill="#f2f2f2" text-anchor="middle">Analytics</text>

    <!-- Publish -->
    <line x1="184" y1="180" x2="274" y2="180" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="229" y="160" font-size="12" fill="#f2c94c" text-anchor="middle">1. Publish</text>
    <text x="229" y="174" font-size="12" fill="#f2c94c" text-anchor="middle">once</text>
    <text x="229" y="202" font-size="12" fill="#a0a0a0" text-anchor="middle">order.placed</text>

    <!-- Fan out -->
    <line x1="444" y1="150" x2="514" y2="80" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="444" y1="170" x2="514" y2="154" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="444" y1="192" x2="514" y2="228" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="444" y1="212" x2="514" y2="304" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="262" font-size="12" fill="#8ea2ff" text-anchor="middle">2. A copy for each</text>
    <text x="360" y="278" font-size="12" fill="#8ea2ff" text-anchor="middle">subscriber</text>

    <text x="30" y="300" font-size="12" fill="#a0a0a0">The order service does not</text>
    <text x="30" y="318" font-size="12" fill="#a0a0a0">wait, and does not know</text>
    <text x="30" y="336" font-size="12" fill="#a0a0a0">who reads the event.</text>
  </g>
</svg>
