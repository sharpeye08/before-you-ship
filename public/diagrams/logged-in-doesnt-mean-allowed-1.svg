<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">Two checks on every request</title>
  <desc id="d">The browser asks for invoice 1041. The server first checks who you are, from the session. Then it checks if you are allowed, which means that you own invoice 1041. Only if both checks pass does the server send the invoice. If you do not own it, the server replies Not found.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="455" y="38" font-size="12" fill="#a0a0a0" text-anchor="middle">ON THE SERVER</text>
    <rect x="200" y="50" width="510" height="150" rx="12" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="6 5"/>

    <!-- Browser -->
    <rect x="24" y="80" width="140" height="90" rx="10" fill="#f2c94c"/>
    <text x="94" y="118" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Browser</text>
    <text x="94" y="140" font-size="12" fill="#111111" text-anchor="middle">"Show invoice 1041"</text>

    <!-- Check 1 -->
    <rect x="216" y="70" width="150" height="110" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="291" y="98" font-size="12" fill="#a0a0a0" text-anchor="middle">1. Authentication</text>
    <text x="291" y="126" font-size="15" fill="#f2f2f2" text-anchor="middle">Who are you?</text>
    <text x="291" y="152" font-size="12" fill="#a0a0a0" text-anchor="middle">from the session</text>

    <!-- Check 2 -->
    <rect x="396" y="70" width="170" height="110" rx="10" fill="#4f6bd8"/>
    <text x="481" y="98" font-size="12" fill="#e8ecff" text-anchor="middle">2. Authorization</text>
    <text x="481" y="126" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Are you allowed?</text>
    <text x="481" y="152" font-size="12" fill="#e8ecff" text-anchor="middle">Do you own 1041?</text>

    <!-- Send the invoice -->
    <rect x="596" y="85" width="104" height="80" rx="10" fill="#1f9d6b"/>
    <text x="648" y="122" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Send the</text>
    <text x="648" y="142" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">invoice</text>

    <!-- Arrows -->
    <line x1="168" y1="125" x2="208" y2="125" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="368" y1="125" x2="388" y2="125" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="568" y1="125" x2="590" y2="125" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="580" y="114" font-size="12" fill="#a0a0a0" text-anchor="middle">yes</text>

    <!-- Fail path -->
    <line x1="481" y1="184" x2="481" y2="226" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
    <text x="492" y="210" font-size="12" fill="#a0a0a0">no</text>
    <rect x="396" y="232" width="170" height="60" rx="10" fill="#1f1f1f" stroke="#e5484d" stroke-width="1.5"/>
    <text x="481" y="267" font-size="15" fill="#f2f2f2" text-anchor="middle">"Not found"</text>

    <text x="24" y="246" font-size="12" fill="#a0a0a0">Many apps only do check 1.</text>
    <text x="24" y="266" font-size="12" fill="#a0a0a0">Then any logged-in user</text>
    <text x="24" y="286" font-size="12" fill="#a0a0a0">can open any invoice.</text>
  </g>
</svg>
