<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">What npm install does</title>
  <desc id="d">First, npm install reads package.json, the list of packages in your project folder. Second, it downloads each package on the list from the npm registry. Third, it puts the downloaded code in the node_modules folder. Your friend can run the same command and get every package on the list.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="330" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="110" y="52" font-size="12" fill="#a0a0a0" text-anchor="middle">YOUR PROJECT FOLDER</text>
    <text x="610" y="52" font-size="12" fill="#a0a0a0" text-anchor="middle">ONLINE</text>

    <!-- package.json -->
    <rect x="30" y="66" width="160" height="90" rx="10" fill="#f2c94c"/>
    <text x="110" y="106" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">package.json</text>
    <text x="110" y="128" font-size="12" fill="#111111" text-anchor="middle">the list</text>

    <!-- npm install -->
    <rect x="280" y="66" width="160" height="90" rx="10" fill="#1f9d6b"/>
    <text x="360" y="106" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">npm install</text>
    <text x="360" y="128" font-size="12" fill="#e6f6ef" text-anchor="middle">(the tool)</text>

    <!-- Registry -->
    <rect x="530" y="66" width="160" height="90" rx="10" fill="#4f6bd8"/>
    <text x="610" y="106" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">npm registry</text>
    <text x="610" y="128" font-size="12" fill="#e8ecff" text-anchor="middle">packages online</text>

    <!-- Arrows top row -->
    <line x1="198" y1="111" x2="272" y2="111" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="235" y="101" font-size="12" fill="#f2c94c" text-anchor="middle">1. reads</text>
    <line x1="524" y1="111" x2="448" y2="111" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="485" y="101" font-size="12" fill="#8ea2ff" text-anchor="middle">2. downloads</text>

    <!-- node_modules -->
    <rect x="30" y="216" width="160" height="80" rx="10" fill="#1f1f1f" stroke="#1f9d6b" stroke-width="1.5"/>
    <text x="110" y="252" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">node_modules</text>
    <text x="110" y="274" font-size="12" fill="#a0a0a0" text-anchor="middle">the downloaded code</text>

    <line x1="300" y1="162" x2="198" y2="232" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="262" y="222" font-size="12" fill="#1f9d6b">3. puts the code here</text>

    <text x="690" y="252" font-size="12" fill="#a0a0a0" text-anchor="end">Your friend runs the same command</text>
    <text x="690" y="270" font-size="12" fill="#a0a0a0" text-anchor="end">and gets every package on the list.</text>
  </g>
</svg>
