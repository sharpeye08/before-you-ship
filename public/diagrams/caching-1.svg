<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d">
  <title id="t">A cache hit and a cache miss</title>
  <desc id="d">A request first looks in the cache. On a cache hit, the saved copy goes back fast. On a cache miss, the server asks the database, saves a new copy in the cache, and then sends the answer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="280" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="30" y="95" width="140" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="100" y="136" font-size="15" fill="#f2f2f2" text-anchor="middle">Request</text>

    <rect x="250" y="95" width="160" height="70" rx="10" fill="#f2c94c"/>
    <text x="330" y="126" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Cache</text>
    <text x="330" y="147" font-size="12" fill="#111111" text-anchor="middle">is a copy there?</text>

    <rect x="510" y="30" width="180" height="70" rx="10" fill="#1f9d6b"/>
    <text x="600" y="60" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Send the copy</text>
    <text x="600" y="81" font-size="12" fill="#e6f5ee" text-anchor="middle">about 1 ms</text>

    <rect x="510" y="160" width="180" height="70" rx="10" fill="#4f6bd8"/>
    <text x="600" y="190" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Ask the database</text>
    <text x="600" y="211" font-size="12" fill="#e8ecff" text-anchor="middle">about 200 ms</text>

    <line x1="170" y1="130" x2="246" y2="130" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="410" y1="115" x2="506" y2="70" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="440" y="80" font-size="12" fill="#1f9d6b" text-anchor="middle">hit</text>
    <line x1="410" y1="145" x2="506" y2="190" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="440" y="190" font-size="12" fill="#8ea2ff" text-anchor="middle">miss</text>

    <path d="M510 222 C 420 250, 340 230, 330 171" fill="none" stroke="#cfcfcf" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="360" y="252" font-size="12" fill="#a0a0a0" text-anchor="end">save a new copy</text>
  </g>
</svg>
