<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">An uptime check with a health check route</title>
  <desc id="d">An uptime check outside your app visits /api/health every few minutes. The route sends SELECT 1 to the database. If the database answers, the route replies ok: true. If not, the route replies with status 503, and the uptime check sends an alert to your phone. The route sends no error details, because anyone can open this address.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="109" y="38" font-size="12" fill="#a0a0a0" text-anchor="middle">OUTSIDE YOUR APP</text>
    <rect x="24" y="50" width="170" height="70" rx="10" fill="#f2c94c"/>
    <text x="109" y="81" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Uptime check</text>
    <text x="109" y="101" font-size="12" fill="#111111" text-anchor="middle">every few minutes</text>
    <line x1="198" y1="85" x2="269" y2="85" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="233" y="76" font-size="12" fill="#a0a0a0" text-anchor="middle">1. visit</text>

    <rect x="275" y="50" width="170" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="81" font-size="15" fill="#f2f2f2" text-anchor="middle">Your app</text>
    <text x="360" y="101" font-size="12" fill="#a0a0a0" text-anchor="middle">/api/health</text>
    <line x1="449" y1="85" x2="520" y2="85" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="484" y="76" font-size="12" fill="#a0a0a0" text-anchor="middle">2. SELECT 1</text>

    <rect x="526" y="50" width="170" height="70" rx="10" fill="#4f6bd8"/>
    <text x="611" y="91" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Database</text>

    <!-- Outcomes -->
    <line x1="330" y1="124" x2="232" y2="184" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="390" y1="124" x2="488" y2="184" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <rect x="130" y="190" width="200" height="70" rx="10" fill="#1f9d6b"/>
    <text x="230" y="221" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">ok: true</text>
    <text x="230" y="241" font-size="12" fill="#e6f6ef" text-anchor="middle">the database answered</text>
    <rect x="390" y="190" width="200" height="70" rx="10" fill="#1f1f1f" stroke="#e5484d" stroke-width="1.5"/>
    <text x="490" y="221" font-size="15" fill="#f2f2f2" text-anchor="middle">503</text>
    <text x="490" y="241" font-size="12" fill="#a0a0a0" text-anchor="middle">alert to your phone</text>

    <text x="360" y="294" font-size="12" fill="#a0a0a0" text-anchor="middle">The route sends no error details, because anyone can open this address.</text>
  </g>
</svg>
