<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Only one request can claim the cart</title>
  <desc id="d">Requests A and B both ask the database to change cart 7 from open to paying, but only if it is still open. The database does the check and the change in one step. Request A changes 1 row, so it charges the card. Request B waits, then finds the cart is no longer open. It changes 0 rows, so it stops with status 409.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Requests -->
    <rect x="30" y="40" width="170" height="70" rx="10" fill="#4f6bd8"/>
    <text x="115" y="70" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Request A</text>
    <text x="115" y="92" font-size="12" fill="#e8ecff" text-anchor="middle">claim cart 7</text>
    <rect x="30" y="180" width="170" height="70" rx="10" fill="#4f6bd8"/>
    <text x="115" y="210" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Request B</text>
    <text x="115" y="232" font-size="12" fill="#e8ecff" text-anchor="middle">claim cart 7</text>

    <!-- Database -->
    <rect x="270" y="95" width="180" height="100" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="130" font-size="15" fill="#f2f2f2" text-anchor="middle">Database</text>
    <text x="360" y="154" font-size="12" fill="#a0a0a0" text-anchor="middle">open to paying,</text>
    <text x="360" y="172" font-size="12" fill="#a0a0a0" text-anchor="middle">only if still open</text>

    <!-- Results -->
    <rect x="520" y="40" width="170" height="70" rx="10" fill="#1f9d6b"/>
    <text x="605" y="70" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">1 row changed</text>
    <text x="605" y="92" font-size="12" fill="#e6f6ef" text-anchor="middle">charge the card</text>
    <rect x="520" y="180" width="170" height="70" rx="10" fill="#f2c94c"/>
    <text x="605" y="210" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">0 rows changed</text>
    <text x="605" y="232" font-size="12" fill="#111111" text-anchor="middle">stop with 409</text>

    <!-- Arrows -->
    <line x1="202" y1="85" x2="264" y2="118" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="202" y1="205" x2="264" y2="172" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="452" y1="118" x2="514" y2="85" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="452" y1="172" x2="514" y2="205" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="360" y="282" font-size="12" fill="#a0a0a0" text-anchor="middle">The check and the change are one step, so there is no gap between them.</text>
  </g>
</svg>
