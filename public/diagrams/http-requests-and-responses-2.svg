<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Where the status code tells you to look</title>
  <desc id="d">The browser sends a request to the server, and the server answers with a status code. A code that starts with 4 points at the request: there is a problem with the request. A code that starts with 5 points at the server: there is a problem on the server.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- 4xx callout -->
    <rect x="260" y="20" width="200" height="54" rx="10" fill="#f08a4b"/>
    <text x="360" y="43" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">4xx</text>
    <text x="360" y="63" font-size="12" fill="#111111" text-anchor="middle">Problem with the request</text>
    <line x1="360" y1="74" x2="360" y2="104" stroke="#f08a4b" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Browser and server -->
    <rect x="40" y="96" width="140" height="80" rx="10" fill="#f2c94c"/>
    <text x="110" y="141" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Browser</text>
    <rect x="540" y="96" width="140" height="80" rx="10" fill="#4f6bd8"/>
    <text x="610" y="141" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Server</text>

    <!-- Request -->
    <line x1="186" y1="112" x2="532" y2="112" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="236" y="104" font-size="12" fill="#f2c94c" text-anchor="middle">Request</text>

    <!-- Response -->
    <line x1="534" y1="160" x2="188" y2="160" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="182" font-size="12" fill="#8ea2ff" text-anchor="middle">Response with a status code</text>

    <!-- 5xx callout -->
    <line x1="610" y1="176" x2="610" y2="212" stroke="#e98da4" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="510" y="212" width="190" height="54" rx="10" fill="#e98da4"/>
    <text x="605" y="235" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">5xx</text>
    <text x="605" y="255" font-size="12" fill="#111111" text-anchor="middle">Problem on the server</text>

    <!-- Other groups -->
    <text x="40" y="230" font-size="12" fill="#a0a0a0">2xx: it worked.</text>
    <text x="40" y="250" font-size="12" fill="#a0a0a0">3xx: look somewhere else.</text>
    <text x="40" y="270" font-size="12" fill="#a0a0a0">Any code: the server got the request.</text>
  </g>
</svg>
