<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">The check-then-write race</title>
  <desc id="d">Server A and Server B read the same count, 99, from Redis at the same moment. Each one decides the count is under 100, allows its request and writes 100. Both requests get through, so the limit lets 101 requests pass.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="30" y="40" width="210" height="80" rx="10" fill="#4f6bd8"/>
    <text x="135" y="74" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Server A</text>
    <text x="135" y="96" font-size="12" fill="#e8ecff" text-anchor="middle">reads 99, allows, writes 100</text>

    <rect x="30" y="180" width="210" height="80" rx="10" fill="#4f6bd8"/>
    <text x="135" y="214" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Server B</text>
    <text x="135" y="236" font-size="12" fill="#e8ecff" text-anchor="middle">reads 99, allows, writes 100</text>

    <rect x="320" y="110" width="150" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="395" y="144" font-size="15" fill="#f2f2f2" text-anchor="middle">Redis</text>
    <text x="395" y="166" font-size="12" fill="#a0a0a0" text-anchor="middle">count = 99</text>

    <line x1="244" y1="92" x2="316" y2="132" stroke="#cfcfcf" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="244" y1="208" x2="316" y2="168" stroke="#cfcfcf" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="280" y="86" font-size="12" fill="#a0a0a0" text-anchor="middle">same moment</text>

    <rect x="550" y="110" width="140" height="80" rx="10" fill="#1f1f1f" stroke="#e5484d" stroke-width="1.5"/>
    <text x="620" y="144" font-size="15" fill="#f2f2f2" text-anchor="middle">101 allowed</text>
    <text x="620" y="166" font-size="12" fill="#e5484d" text-anchor="middle">the limit leaks</text>
    <line x1="470" y1="150" x2="546" y2="150" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>

    <text x="360" y="285" font-size="12" fill="#a0a0a0" text-anchor="middle">Both servers read 99 before either one writes, so both allow their request.</text>
  </g>
</svg>
