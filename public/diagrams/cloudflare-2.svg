<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">The Flexible mode redirect loop</title>
  <desc id="d">Step 1: the visitor reaches Cloudflare over HTTPS. Step 2: in Flexible mode, Cloudflare reaches your server over plain HTTP. Step 3: your server sees HTTP and redirects the visitor to HTTPS. Step 4: the visitor comes back to Cloudflare over HTTPS, and the loop repeats until the browser gives up.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="24" y="70" width="140" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="94" y="115" font-size="15" fill="#f2f2f2" text-anchor="middle">Visitor</text>

    <rect x="290" y="70" width="140" height="80" rx="10" fill="#f08a4b"/>
    <text x="360" y="106" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Cloudflare</text>
    <text x="360" y="126" font-size="12" fill="#111111" text-anchor="middle">mode: Flexible</text>

    <rect x="556" y="70" width="140" height="80" rx="10" fill="#4f6bd8"/>
    <text x="626" y="106" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Your server</text>
    <text x="626" y="126" font-size="12" fill="#e8ecff" text-anchor="middle">redirects HTTP</text>

    <!-- 1 and 2 -->
    <line x1="168" y1="110" x2="282" y2="110" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="225" y="100" font-size="12" fill="#f2c94c" text-anchor="middle">1. HTTPS</text>
    <line x1="434" y1="110" x2="548" y2="110" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="491" y="100" font-size="12" fill="#f2c94c" text-anchor="middle">2. plain HTTP</text>

    <!-- 3 redirect back -->
    <path d="M626 154 L626 214 L94 214 L94 158" fill="none" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <text x="360" y="240" font-size="15" fill="#f2f2f2" text-anchor="middle">3. "Redirect to https://example.com"</text>

    <text x="360" y="280" font-size="12" fill="#a0a0a0" text-anchor="middle">4. The visitor comes back over HTTPS, and step 1 starts again.</text>
    <text x="360" y="298" font-size="12" fill="#a0a0a0" text-anchor="middle">The loop repeats until the browser gives up.</text>

    <text x="360" y="44" font-size="12" fill="#e5484d" text-anchor="middle">ERR_TOO_MANY_REDIRECTS</text>
  </g>
</svg>
