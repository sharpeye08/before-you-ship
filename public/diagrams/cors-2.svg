<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t d">
  <title id="t">A preflight before a POST</title>
  <desc id="d">Step 1: the browser sends an OPTIONS request that asks if a POST from localhost:5173 is allowed. Step 2: the server answers yes, with the allowed origin, methods and headers. Step 3: only then does the browser send the real POST. Step 4: the server sends the response. If step 2 does not say yes, the browser never sends step 3.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="350" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Browser -->
    <rect x="24" y="24" width="150" height="56" rx="10" fill="#f2c94c"/>
    <text x="99" y="58" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Browser</text>
    <line x1="99" y1="80" x2="99" y2="300" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="4 6"/>

    <!-- Server -->
    <rect x="546" y="24" width="150" height="56" rx="10" fill="#4f6bd8"/>
    <text x="621" y="58" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Your API</text>
    <line x1="621" y1="80" x2="621" y2="300" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="4 6"/>

    <!-- 1. OPTIONS -->
    <line x1="103" y1="122" x2="613" y2="122" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="112" font-size="15" fill="#f2f2f2" text-anchor="middle">1. OPTIONS: "May I send a POST?"</text>

    <!-- 2. Yes -->
    <line x1="617" y1="176" x2="107" y2="176" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="166" font-size="15" fill="#f2f2f2" text-anchor="middle">2. "Yes: that origin, those methods"</text>

    <!-- 3. POST -->
    <line x1="103" y1="230" x2="613" y2="230" stroke="#1f9d6b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="220" font-size="15" fill="#f2f2f2" text-anchor="middle">3. The real POST (save the note)</text>

    <!-- 4. Response -->
    <line x1="617" y1="284" x2="107" y2="284" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="360" y="274" font-size="15" fill="#f2f2f2" text-anchor="middle">4. Response</text>

    <text x="360" y="328" font-size="12" fill="#a0a0a0" text-anchor="middle">If step 2 does not say yes, the browser stops and never sends step 3.</text>
  </g>
</svg>
