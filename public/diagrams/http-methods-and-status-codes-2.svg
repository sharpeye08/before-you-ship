<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="t d">
  <title id="t">The same request sent twice</title>
  <desc id="d">DELETE /api/notes/42 sent twice leaves note 42 deleted, the same result as sending it once, so DELETE is idempotent. POST /api/notes sent twice creates two new notes, one too many, so POST is not idempotent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="290" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Idempotent -->
    <text x="40" y="38" font-size="12" fill="#a0a0a0">IDEMPOTENT: TWICE HAS THE SAME EFFECT AS ONCE</text>
    <rect x="40" y="50" width="240" height="36" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="160" y="73" font-size="15" fill="#f2f2f2" text-anchor="middle">DELETE /api/notes/42</text>
    <rect x="40" y="94" width="240" height="36" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="160" y="117" font-size="15" fill="#f2f2f2" text-anchor="middle">DELETE /api/notes/42</text>
    <line x1="284" y1="90" x2="434" y2="90" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="359" y="80" font-size="12" fill="#a0a0a0" text-anchor="middle">sent twice</text>
    <rect x="440" y="58" width="240" height="64" rx="10" fill="#1f9d6b"/>
    <text x="560" y="85" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Note 42 is deleted</text>
    <text x="560" y="105" font-size="12" fill="#dff5ec" text-anchor="middle">same result as once</text>

    <!-- Not idempotent -->
    <text x="40" y="172" font-size="12" fill="#a0a0a0">NOT IDEMPOTENT</text>
    <rect x="40" y="184" width="240" height="36" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="160" y="207" font-size="15" fill="#f2f2f2" text-anchor="middle">POST /api/notes</text>
    <rect x="40" y="228" width="240" height="36" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="160" y="251" font-size="15" fill="#f2f2f2" text-anchor="middle">POST /api/notes</text>
    <line x1="284" y1="224" x2="434" y2="224" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="359" y="214" font-size="12" fill="#a0a0a0" text-anchor="middle">sent twice</text>
    <rect x="440" y="192" width="240" height="64" rx="10" fill="#f08a4b"/>
    <text x="560" y="219" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Two new notes</text>
    <text x="560" y="239" font-size="12" fill="#111111" text-anchor="middle">one too many</text>
  </g>
</svg>
