<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">Your app and its database</title>
  <desc id="d">Your backend sends a request to the database: save this message. The database, which runs on its own server, saves it and answers. When your app restarts or you deploy, your app starts from a clean copy, but the database keeps every message.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- App -->
    <text x="140" y="44" font-size="12" fill="#a0a0a0" text-anchor="middle">YOUR SERVER</text>
    <rect x="40" y="58" width="200" height="100" rx="10" fill="#4f6bd8"/>
    <text x="140" y="102" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Your backend</text>
    <text x="140" y="124" font-size="12" fill="#e8ecff" text-anchor="middle">(your app's code)</text>

    <!-- Database -->
    <text x="580" y="44" font-size="12" fill="#a0a0a0" text-anchor="middle">ITS OWN SERVER</text>
    <rect x="480" y="58" width="200" height="100" rx="10" fill="#1f9d6b"/>
    <text x="580" y="102" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Database</text>
    <text x="580" y="124" font-size="12" fill="#e6f6ef" text-anchor="middle">(keeps the messages)</text>

    <!-- Request -->
    <line x1="246" y1="88" x2="472" y2="88" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="359" y="76" font-size="12" fill="#8ea2ff" text-anchor="middle">1. Request</text>
    <text x="359" y="108" font-size="12" fill="#a0a0a0" text-anchor="middle">"Save this message."</text>

    <!-- Answer -->
    <line x1="474" y1="136" x2="248" y2="136" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="361" y="156" font-size="12" fill="#1f9d6b" text-anchor="middle">2. Answer</text>
    <text x="361" y="174" font-size="12" fill="#a0a0a0" text-anchor="middle">"Saved."</text>

    <!-- Restart note -->
    <rect x="40" y="208" width="640" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="60" y="238" font-size="12" fill="#1f9d6b">Your app restarts or you deploy</text>
    <text x="60" y="262" font-size="15" fill="#f2f2f2">Your app starts from a clean copy. The database keeps every message.</text>
    <text x="60" y="280" font-size="12" fill="#a0a0a0">The data is persistent.</text>
  </g>
</svg>
