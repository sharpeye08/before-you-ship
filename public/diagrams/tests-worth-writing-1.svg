<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">One change, three regressions</title>
  <desc id="d">The AI changes calculateTotal to fix the SAVE10 discount code. Without a code, the function now returns 0. Checkout, the receipt emails and the sales report all use the same function, so all three become wrong.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="24" y="125" width="150" height="70" rx="10" fill="#f2c94c"/>
    <text x="99" y="156" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">AI change</text>
    <text x="99" y="176" font-size="12" fill="#111111" text-anchor="middle">fix SAVE10</text>
    <line x1="178" y1="160" x2="224" y2="160" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="230" y="125" width="180" height="70" rx="10" fill="#f08a4b"/>
    <text x="320" y="156" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">calculateTotal</text>
    <text x="320" y="176" font-size="12" fill="#111111" text-anchor="middle">without a code: 0</text>
    <text x="320" y="222" font-size="12" fill="#a0a0a0" text-anchor="middle">one function,</text>
    <text x="320" y="238" font-size="12" fill="#a0a0a0" text-anchor="middle">used in three places</text>

    <line x1="414" y1="145" x2="494" y2="64" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <line x1="414" y1="160" x2="494" y2="160" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <line x1="414" y1="175" x2="494" y2="256" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>

    <rect x="500" y="30" width="196" height="60" rx="10" fill="#1f1f1f" stroke="#e5484d" stroke-width="1.5"/>
    <text x="598" y="56" font-size="15" fill="#f2f2f2" text-anchor="middle">Checkout</text>
    <text x="598" y="76" font-size="12" fill="#a0a0a0" text-anchor="middle">orders cost $0</text>
    <rect x="500" y="130" width="196" height="60" rx="10" fill="#1f1f1f" stroke="#e5484d" stroke-width="1.5"/>
    <text x="598" y="156" font-size="15" fill="#f2f2f2" text-anchor="middle">Receipt emails</text>
    <text x="598" y="176" font-size="12" fill="#a0a0a0" text-anchor="middle">wrong total</text>
    <rect x="500" y="230" width="196" height="60" rx="10" fill="#1f1f1f" stroke="#e5484d" stroke-width="1.5"/>
    <text x="598" y="256" font-size="15" fill="#f2f2f2" text-anchor="middle">Sales report</text>
    <text x="598" y="276" font-size="12" fill="#a0a0a0" text-anchor="middle">almost nothing sold</text>
  </g>
</svg>
