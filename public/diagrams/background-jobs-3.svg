<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">One job, two emails</title>
  <desc id="d">The queue gives a job to worker A. Worker A sends the email, then crashes before it tells the queue that the job is done. The queue gives the same job again to worker B, which sends the email again. The user's inbox gets two welcome emails.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="30" y="110" width="130" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="95" y="155" font-size="15" fill="#f2f2f2" text-anchor="middle">Queue</text>

    <rect x="250" y="30" width="200" height="80" rx="10" fill="#1f1f1f" stroke="#e5484d" stroke-width="2"/>
    <text x="350" y="62" font-size="15" fill="#f2f2f2" text-anchor="middle">Worker A</text>
    <text x="350" y="86" font-size="12" fill="#a0a0a0" text-anchor="middle">sends email, then crashes</text>

    <rect x="250" y="190" width="200" height="80" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="350" y="222" font-size="15" fill="#f2f2f2" text-anchor="middle">Worker B</text>
    <text x="350" y="246" font-size="12" fill="#a0a0a0" text-anchor="middle">gets the same job again</text>

    <rect x="540" y="110" width="150" height="80" rx="10" fill="#e98da4"/>
    <text x="615" y="146" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">User's inbox</text>
    <text x="615" y="168" font-size="12" fill="#111111" text-anchor="middle">2 welcome emails</text>

    <line x1="166" y1="118" x2="244" y2="62" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="196" y="78" font-size="12" fill="#a0a0a0" text-anchor="end">1. Job</text>

    <line x1="244" y1="96" x2="168" y2="138" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowRed)"/>
    <text x="350" y="150" font-size="12" fill="#e5484d" text-anchor="middle">2. "Done" never reaches the queue</text>

    <line x1="166" y1="170" x2="244" y2="226" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="196" y="230" font-size="12" fill="#a0a0a0" text-anchor="end">3. Job again</text>

    <line x1="456" y1="70" x2="534" y2="128" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="82" font-size="12" fill="#a0a0a0">Email 1</text>

    <line x1="456" y1="230" x2="534" y2="172" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="234" font-size="12" fill="#a0a0a0">Email 2</text>
  </g>
</svg>
