<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="t d">
  <title id="t">Retries with longer waits</title>
  <desc id="d">A timeline. Try 1 fails, and the code waits about 1 second. Try 2 fails, and the code waits about 2 seconds. Try 3 works. Each wait has a small random part, so many users do not retry at the same moment.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="250" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="30" y="44" font-size="12" fill="#a0a0a0">EXPONENTIAL BACKOFF WITH JITTER</text>

    <rect x="30" y="80" width="110" height="60" rx="10" fill="#1f1f1f" stroke="#e5484d" stroke-width="2"/>
    <text x="85" y="106" font-size="15" fill="#f2f2f2" text-anchor="middle">Try 1</text>
    <text x="85" y="126" font-size="12" fill="#e5484d" text-anchor="middle">fails</text>

    <line x1="144" y1="110" x2="246" y2="110" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="195" y="100" font-size="12" fill="#a0a0a0" text-anchor="middle">wait ~1 s</text>

    <rect x="250" y="80" width="110" height="60" rx="10" fill="#1f1f1f" stroke="#e5484d" stroke-width="2"/>
    <text x="305" y="106" font-size="15" fill="#f2f2f2" text-anchor="middle">Try 2</text>
    <text x="305" y="126" font-size="12" fill="#e5484d" text-anchor="middle">fails</text>

    <line x1="364" y1="110" x2="576" y2="110" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="470" y="100" font-size="12" fill="#a0a0a0" text-anchor="middle">wait ~2 s</text>

    <rect x="580" y="80" width="110" height="60" rx="10" fill="#1f9d6b"/>
    <text x="635" y="106" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Try 3</text>
    <text x="635" y="126" font-size="12" fill="#e6fff4" text-anchor="middle">works</text>

    <line x1="30" y1="170" x2="684" y2="170" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="690" y="190" font-size="12" fill="#a0a0a0" text-anchor="end">time</text>

    <text x="30" y="214" font-size="12" fill="#a0a0a0">Each wait is about two times longer than the one before (backoff).</text>
    <text x="30" y="232" font-size="12" fill="#a0a0a0">Each wait also has a small random part (jitter), so users do not all retry together.</text>
  </g>
</svg>
