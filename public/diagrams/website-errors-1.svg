<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="t d">
  <title id="t">The four steps of the trip</title>
  <desc id="d">Four steps in order. Step 1, find the address: DNS turns the name into an IP address. Errors here look like DNS_PROBE codes. Step 2, connect: the browser reaches the server. Errors here say refused or timed out. Step 3, ask and answer: a request, then a status code. Errors here are codes like 404 or 500. Step 4, build the page from HTML, CSS and JavaScript. Errors here show as a blank page.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="270" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Step boxes -->
    <rect x="40" y="40" width="145" height="110" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="56" y="64" font-size="12" fill="#f2c94c">Step 1</text>
    <text x="56" y="88" font-size="15" fill="#f2f2f2">Find the address</text>
    <text x="56" y="112" font-size="12" fill="#a0a0a0">DNS turns the name</text>
    <text x="56" y="130" font-size="12" fill="#a0a0a0">into an IP address</text>

    <rect x="205" y="40" width="145" height="110" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="221" y="64" font-size="12" fill="#8ea2ff">Step 2</text>
    <text x="221" y="88" font-size="15" fill="#f2f2f2">Connect</text>
    <text x="221" y="112" font-size="12" fill="#a0a0a0">The browser reaches</text>
    <text x="221" y="130" font-size="12" fill="#a0a0a0">the server</text>

    <rect x="370" y="40" width="145" height="110" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="386" y="64" font-size="12" fill="#e98da4">Step 3</text>
    <text x="386" y="88" font-size="15" fill="#f2f2f2">Ask and answer</text>
    <text x="386" y="112" font-size="12" fill="#a0a0a0">A request, then a</text>
    <text x="386" y="130" font-size="12" fill="#a0a0a0">status code</text>

    <rect x="535" y="40" width="145" height="110" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="551" y="64" font-size="12" fill="#1f9d6b">Step 4</text>
    <text x="551" y="88" font-size="15" fill="#f2f2f2">Build the page</text>
    <text x="551" y="112" font-size="12" fill="#a0a0a0">HTML, CSS and</text>
    <text x="551" y="130" font-size="12" fill="#a0a0a0">JavaScript</text>

    <!-- Arrows -->
    <line x1="187" y1="95" x2="201" y2="95" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="352" y1="95" x2="366" y2="95" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="517" y1="95" x2="531" y2="95" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Errors you see -->
    <text x="40" y="184" font-size="12" fill="#a0a0a0">IF IT BREAKS, YOU SEE:</text>
    <text x="112" y="210" font-size="12" fill="#f2f2f2" text-anchor="middle">DNS_PROBE_...</text>
    <text x="277" y="210" font-size="12" fill="#f2f2f2" text-anchor="middle">refused, timed out</text>
    <text x="442" y="210" font-size="12" fill="#f2f2f2" text-anchor="middle">404, 500</text>
    <text x="607" y="210" font-size="12" fill="#f2f2f2" text-anchor="middle">blank page</text>

    <text x="360" y="248" font-size="12" fill="#a0a0a0" text-anchor="middle">An error at one step means that every step before it worked.</text>
  </g>
</svg>
