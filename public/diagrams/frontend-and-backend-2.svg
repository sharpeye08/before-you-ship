<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">The trust boundary</title>
  <desc id="d">A dashed line called the trust boundary splits two sides. On the left, the user controls the browser, which runs the frontend. The user can read and change everything there. On the right, you control the server, which runs the backend. Every request crosses the line from the browser to the server, and the server checks it and decides.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Left side -->
    <rect x="30" y="50" width="300" height="230" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="180" y="78" font-size="12" fill="#a0a0a0" text-anchor="middle">THE USER CONTROLS</text>
    <rect x="70" y="106" width="220" height="90" rx="10" fill="#f2c94c"/>
    <text x="180" y="146" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Browser</text>
    <text x="180" y="168" font-size="12" fill="#111111" text-anchor="middle">runs the frontend</text>
    <text x="180" y="234" font-size="12" fill="#a0a0a0" text-anchor="middle">The user can read and</text>
    <text x="180" y="252" font-size="12" fill="#a0a0a0" text-anchor="middle">change everything here</text>

    <!-- Right side -->
    <rect x="390" y="50" width="300" height="230" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="540" y="78" font-size="12" fill="#a0a0a0" text-anchor="middle">YOU CONTROL</text>
    <rect x="430" y="106" width="220" height="90" rx="10" fill="#4f6bd8"/>
    <text x="540" y="146" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Server</text>
    <text x="540" y="168" font-size="12" fill="#e8ecff" text-anchor="middle">runs the backend</text>
    <text x="540" y="234" font-size="12" fill="#a0a0a0" text-anchor="middle">The server checks every</text>
    <text x="540" y="252" font-size="12" fill="#a0a0a0" text-anchor="middle">request and decides</text>

    <!-- Trust boundary -->
    <text x="360" y="30" font-size="12" fill="#f08a4b" text-anchor="middle">TRUST BOUNDARY</text>
    <line x1="360" y1="40" x2="360" y2="296" stroke="#f08a4b" stroke-width="2" stroke-dasharray="6 5"/>

    <!-- Request crossing -->
    <line x1="294" y1="151" x2="424" y2="151" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="326" y="124" width="68" height="18" rx="9" fill="#141414"/>
    <text x="360" y="137" font-size="12" fill="#f2c94c" text-anchor="middle">Request</text>

    <text x="360" y="310" font-size="12" fill="#a0a0a0" text-anchor="middle">Anything that crosses the line might have changed on the way.</text>
  </g>
</svg>
