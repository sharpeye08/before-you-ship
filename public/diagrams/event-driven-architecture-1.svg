<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t d">
  <title id="t">When everything calls everything</title>
  <desc id="d">Six services call each other directly. Orders calls email, warehouse, loyalty and analytics. Warehouse and analytics call orders back. Loyalty calls users, and users calls email. Every arrow is a place where one service waits for another.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="370" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Orders -->
    <rect x="40" y="150" width="130" height="50" rx="10" fill="#f2c94c"/>
    <text x="105" y="180" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Orders</text>

    <!-- Email -->
    <rect x="300" y="40" width="130" height="50" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="365" y="70" font-size="15" fill="#f2f2f2" text-anchor="middle">Email</text>

    <!-- Warehouse -->
    <rect x="300" y="150" width="130" height="50" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="365" y="180" font-size="15" fill="#f2f2f2" text-anchor="middle">Warehouse</text>

    <!-- Loyalty -->
    <rect x="300" y="260" width="130" height="50" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="365" y="290" font-size="15" fill="#f2f2f2" text-anchor="middle">Loyalty</text>

    <!-- Users -->
    <rect x="550" y="260" width="130" height="50" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="615" y="290" font-size="15" fill="#f2f2f2" text-anchor="middle">Users</text>

    <!-- Analytics -->
    <rect x="40" y="280" width="130" height="50" rx="10" fill="#1f1f1f" stroke="#e5484d" stroke-width="1.5"/>
    <text x="105" y="310" font-size="15" fill="#f2f2f2" text-anchor="middle">Analytics</text>
    <text x="105" y="350" font-size="12" fill="#e5484d" text-anchor="middle">bug: 20 s per call</text>

    <!-- orders -> email -->
    <line x1="172" y1="152" x2="294" y2="80" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- orders <-> warehouse -->
    <line x1="172" y1="166" x2="294" y2="166" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="298" y1="186" x2="176" y2="186" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- orders -> loyalty -->
    <line x1="172" y1="198" x2="294" y2="270" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- orders <-> analytics -->
    <line x1="90" y1="202" x2="90" y2="274" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="120" y1="278" x2="120" y2="206" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- loyalty -> users -->
    <line x1="432" y1="285" x2="544" y2="285" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- users -> email -->
    <line x1="600" y1="258" x2="438" y2="84" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="690" y="110" font-size="12" fill="#a0a0a0" text-anchor="end">Every arrow: one service</text>
    <text x="690" y="128" font-size="12" fill="#a0a0a0" text-anchor="end">waits for another.</text>
    <text x="690" y="350" font-size="12" fill="#a0a0a0" text-anchor="end">Each new feature adds more arrows.</text>
  </g>
</svg>
