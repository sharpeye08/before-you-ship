<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Vertical and horizontal scaling</title>
  <desc id="d">Left: vertical scaling replaces a small machine with a bigger machine that has more CPU and more memory. This is best for databases at first. Right: horizontal scaling puts a load balancer in front of several instances. This is best for app servers and functions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Vertical -->
    <text x="40" y="40" font-size="12" fill="#a0a0a0">VERTICAL: A BIGGER MACHINE</text>
    <rect x="50" y="128" width="80" height="60" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="90" y="163" font-size="15" fill="#f2f2f2" text-anchor="middle">Small</text>
    <line x1="136" y1="158" x2="174" y2="158" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="182" y="70" width="150" height="160" rx="10" fill="#1f9d6b"/>
    <text x="257" y="142" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Bigger</text>
    <text x="257" y="162" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">machine</text>
    <text x="257" y="186" font-size="12" fill="#e6fff4" text-anchor="middle">more CPU, memory</text>
    <text x="190" y="268" font-size="12" fill="#a0a0a0" text-anchor="middle">Best for databases, at first</text>

    <line x1="360" y1="40" x2="360" y2="270" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Horizontal -->
    <text x="380" y="40" font-size="12" fill="#a0a0a0">HORIZONTAL: MORE MACHINES</text>
    <rect x="380" y="128" width="124" height="60" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="442" y="155" font-size="15" fill="#f2f2f2" text-anchor="middle">Load</text>
    <text x="442" y="175" font-size="15" fill="#f2f2f2" text-anchor="middle">balancer</text>
    <rect x="560" y="70" width="120" height="44" rx="10" fill="#4f6bd8"/>
    <text x="620" y="97" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Instance</text>
    <rect x="560" y="136" width="120" height="44" rx="10" fill="#4f6bd8"/>
    <text x="620" y="163" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Instance</text>
    <rect x="560" y="202" width="120" height="44" rx="10" fill="#4f6bd8"/>
    <text x="620" y="229" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Instance</text>
    <line x1="508" y1="150" x2="554" y2="94" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="508" y1="158" x2="554" y2="158" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="508" y1="166" x2="554" y2="222" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="530" y="276" font-size="12" fill="#a0a0a0" text-anchor="middle">Best for app servers and functions</text>
  </g>
</svg>
