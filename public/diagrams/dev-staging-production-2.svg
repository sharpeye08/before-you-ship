<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">Same code, different settings</title>
  <desc id="d">The same code runs in three environments. Development uses a local test database, a test payment key, emails that are only logged, and APP_ENV set to development. Staging uses a staging database, a test payment key, emails to the team inbox only, and APP_ENV set to staging. Production uses the production database, the live payment key, real emails, and APP_ENV set to production.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="360" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Same code -->
    <rect x="260" y="20" width="200" height="54" rx="10" fill="#f2c94c"/>
    <text x="360" y="45" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Same code</text>
    <text x="360" y="63" font-size="12" fill="#111111" text-anchor="middle">one version</text>
    <line x1="300" y1="78" x2="140" y2="124" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="360" y1="78" x2="360" y2="124" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="420" y1="78" x2="580" y2="124" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Development -->
    <rect x="24" y="130" width="208" height="210" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="128" y="158" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Development</text>
    <text x="40" y="186" font-size="12" fill="#a0a0a0">DATABASE_URL</text>
    <text x="40" y="202" font-size="12" fill="#f2f2f2">local test database</text>
    <text x="40" y="226" font-size="12" fill="#a0a0a0">STRIPE_KEY</text>
    <text x="40" y="242" font-size="12" fill="#f2f2f2">sk_test_...</text>
    <text x="40" y="266" font-size="12" fill="#a0a0a0">EMAIL_MODE</text>
    <text x="40" y="282" font-size="12" fill="#f2f2f2">log only</text>
    <text x="40" y="306" font-size="12" fill="#a0a0a0">APP_ENV</text>
    <text x="40" y="322" font-size="12" fill="#f2f2f2">development</text>

    <!-- Staging -->
    <rect x="256" y="130" width="208" height="210" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="360" y="158" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Staging</text>
    <text x="272" y="186" font-size="12" fill="#a0a0a0">DATABASE_URL</text>
    <text x="272" y="202" font-size="12" fill="#f2f2f2">staging database</text>
    <text x="272" y="226" font-size="12" fill="#a0a0a0">STRIPE_KEY</text>
    <text x="272" y="242" font-size="12" fill="#f2f2f2">sk_test_...</text>
    <text x="272" y="266" font-size="12" fill="#a0a0a0">EMAIL_MODE</text>
    <text x="272" y="282" font-size="12" fill="#f2f2f2">team inbox only</text>
    <text x="272" y="306" font-size="12" fill="#a0a0a0">APP_ENV</text>
    <text x="272" y="322" font-size="12" fill="#f2f2f2">staging</text>

    <!-- Production -->
    <rect x="488" y="130" width="208" height="210" rx="10" fill="#4f6bd8"/>
    <text x="592" y="158" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Production</text>
    <text x="504" y="186" font-size="12" fill="#e8ecff">DATABASE_URL</text>
    <text x="504" y="202" font-size="12" fill="#f2f2f2">production database</text>
    <text x="504" y="226" font-size="12" fill="#e8ecff">STRIPE_KEY</text>
    <text x="504" y="242" font-size="12" fill="#f2f2f2">sk_live_...</text>
    <text x="504" y="266" font-size="12" fill="#e8ecff">EMAIL_MODE</text>
    <text x="504" y="282" font-size="12" fill="#f2f2f2">send</text>
    <text x="504" y="306" font-size="12" fill="#e8ecff">APP_ENV</text>
    <text x="504" y="322" font-size="12" fill="#f2f2f2">production</text>
  </g>
</svg>
