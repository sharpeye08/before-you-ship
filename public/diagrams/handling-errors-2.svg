<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">How a thrown error travels back</title>
  <desc id="d">Your route calls createBooking, and createBooking calls the database. The database save fails and throws an error. The error goes back to createBooking, which has no try and catch, and then back to your route. The catch block in your route runs: it logs the error and shows a short message.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>
  <rect width="720" height="360" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <!-- Stack -->
    <rect x="60" y="40" width="260" height="70" rx="10" fill="#f2c94c"/>
    <text x="190" y="70" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">Your route</text>
    <text x="190" y="92" font-size="12" fill="#111111" text-anchor="middle">has try / catch</text>

    <rect x="60" y="150" width="260" height="70" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="190" y="180" font-size="15" fill="#f2f2f2" text-anchor="middle">createBooking()</text>
    <text x="190" y="202" font-size="12" fill="#a0a0a0" text-anchor="middle">no try / catch</text>

    <rect x="60" y="260" width="260" height="70" rx="10" fill="#e5484d"/>
    <text x="190" y="290" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Database save</text>
    <text x="190" y="312" font-size="12" fill="#fde8e8" text-anchor="middle">fails and throws</text>

    <!-- Calls (down) -->
    <line x1="100" y1="112" x2="100" y2="144" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="40" y="133" font-size="12" fill="#a0a0a0" text-anchor="middle">calls</text>
    <line x1="100" y1="222" x2="100" y2="254" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="40" y="243" font-size="12" fill="#a0a0a0" text-anchor="middle">calls</text>

    <!-- Error goes back (up) -->
    <line x1="280" y1="258" x2="280" y2="226" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <line x1="280" y1="148" x2="280" y2="116" stroke="#e5484d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <text x="292" y="133" font-size="12" fill="#ff8a8d">error</text>
    <text x="292" y="243" font-size="12" fill="#ff8a8d">error</text>

    <!-- Catch -->
    <rect x="420" y="40" width="270" height="70" rx="10" fill="#1f9d6b"/>
    <text x="555" y="70" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">catch runs</text>
    <text x="555" y="92" font-size="12" fill="#e6f6ef" text-anchor="middle">log it, show a short message</text>
    <line x1="322" y1="75" x2="412" y2="75" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="420" y="176" font-size="12" fill="#a0a0a0">If nothing catches the error:</text>
    <text x="420" y="196" font-size="12" fill="#a0a0a0">the request fails with a 500,</text>
    <text x="420" y="212" font-size="12" fill="#a0a0a0">or the server program stops.</text>
  </g>
</svg>
