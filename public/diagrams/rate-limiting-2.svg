<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">A counter in memory and a shared counter</title>
  <desc id="d">Left: each copy of your code keeps its own counter in memory, so each copy allows the full limit of 10 per minute. With 20 copies, 200 requests per minute can get through. Right: every copy uses one shared counter in a store like Redis, so all copies see the same count and the limit stays 10.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cfcfcf"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <line x1="360" y1="24" x2="360" y2="296" stroke="#3a3a3a" stroke-width="1.5"/>

    <!-- Left: counter in memory -->
    <text x="40" y="44" font-size="12" fill="#e5484d">COUNTER IN EACH COPY'S MEMORY</text>
    <rect x="40" y="58" width="280" height="52" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="56" y="89" font-size="15" fill="#f2f2f2">Copy 1</text>
    <text x="304" y="89" font-size="12" fill="#e5484d" text-anchor="end">own counter: 10 allowed</text>
    <rect x="40" y="122" width="280" height="52" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="56" y="153" font-size="15" fill="#f2f2f2">Copy 2</text>
    <text x="304" y="153" font-size="12" fill="#e5484d" text-anchor="end">own counter: 10 allowed</text>
    <rect x="40" y="186" width="280" height="52" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="56" y="217" font-size="15" fill="#f2f2f2">Copy 3</text>
    <text x="304" y="217" font-size="12" fill="#e5484d" text-anchor="end">own counter: 10 allowed</text>
    <text x="40" y="270" font-size="12" fill="#a0a0a0">Limit: 10 per minute. With 20 copies,</text>
    <text x="40" y="288" font-size="12" fill="#a0a0a0">200 per minute can get through.</text>

    <!-- Right: shared counter -->
    <text x="392" y="44" font-size="12" fill="#1f9d6b">ONE SHARED COUNTER</text>
    <rect x="392" y="58" width="104" height="52" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="444" y="89" font-size="15" fill="#f2f2f2" text-anchor="middle">Copy 1</text>
    <rect x="392" y="122" width="104" height="52" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="444" y="153" font-size="15" fill="#f2f2f2" text-anchor="middle">Copy 2</text>
    <rect x="392" y="186" width="104" height="52" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="444" y="217" font-size="15" fill="#f2f2f2" text-anchor="middle">Copy 3</text>

    <rect x="560" y="100" width="136" height="96" rx="10" fill="#1f9d6b"/>
    <text x="628" y="134" font-size="15" font-weight="600" fill="#f2f2f2" text-anchor="middle">Shared store</text>
    <text x="628" y="154" font-size="12" fill="#e6f6ef" text-anchor="middle">like Redis</text>
    <text x="628" y="176" font-size="12" fill="#e6f6ef" text-anchor="middle">one counter</text>

    <line x1="500" y1="84" x2="552" y2="124" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="500" y1="148" x2="552" y2="148" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="500" y1="212" x2="552" y2="172" stroke="#cfcfcf" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="392" y="270" font-size="12" fill="#a0a0a0">Every copy sees the same count,</text>
    <text x="392" y="288" font-size="12" fill="#a0a0a0">so the limit stays 10 per minute.</text>
  </g>
</svg>
