<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="t d">
  <title id="t">How a small price becomes a large bill</title>
  <desc id="d">1 cent per call, times 5 calls per second, times 48 hours (one weekend), equals 864,000 calls, which cost 8,640 dollars. Code repeats a small price at computer speed.</desc>
  <rect width="720" height="230" rx="16" fill="#141414"/>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="30" y="60" width="120" height="90" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="90" y="102" font-size="15" fill="#f2f2f2" text-anchor="middle">1 cent</text>
    <text x="90" y="124" font-size="12" fill="#a0a0a0" text-anchor="middle">per call</text>

    <text x="170" y="112" font-size="15" fill="#cfcfcf" text-anchor="middle">×</text>

    <rect x="190" y="60" width="120" height="90" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="250" y="102" font-size="15" fill="#f2f2f2" text-anchor="middle">5 calls</text>
    <text x="250" y="124" font-size="12" fill="#a0a0a0" text-anchor="middle">per second</text>

    <text x="330" y="112" font-size="15" fill="#cfcfcf" text-anchor="middle">×</text>

    <rect x="350" y="60" width="120" height="90" rx="10" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="410" y="102" font-size="15" fill="#f2f2f2" text-anchor="middle">48 hours</text>
    <text x="410" y="124" font-size="12" fill="#a0a0a0" text-anchor="middle">one weekend</text>

    <text x="490" y="112" font-size="15" fill="#cfcfcf" text-anchor="middle">=</text>

    <rect x="510" y="60" width="180" height="90" rx="10" fill="#f08a4b"/>
    <text x="600" y="102" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">$8,640</text>
    <text x="600" y="124" font-size="12" fill="#111111" text-anchor="middle">864,000 calls</text>

    <text x="360" y="196" font-size="12" fill="#a0a0a0" text-anchor="middle">Code repeats a small price at computer speed, all day and all night.</text>
  </g>
</svg>
